name: Auto-merge
run-name: "Auto-merge — PR #${{ github.event.pull_request.number }}"

# 🏷️ Label a PR `automerge` and GitHub merges it once CI is green.
#
# This job does not merge anything itself. It arms GitHub's own auto-merge and
# steps back, which matters for two reasons:
#
#   1. A merge made with GITHUB_TOKEN does not trigger other workflows, so a
#      hand-rolled merge here would leave release-please asleep on the push to
#      main. Native auto-merge is attributed to the person who armed it, so the
#      push behaves like any other and the release pipeline wakes up. The same
#      trap is why release-please.yaml uses secrets.PAT for its gated merge.
#   2. What it waits for is the branch protection on main, not a rule written
#      here, so there is one definition of "green" rather than two that can
#      drift apart.
#
# ⚠️ PREREQ: main must require the "Lint, test & build" check, and the repo must
# allow auto-merge. Without a required check GitHub refuses to arm auto-merge,
# because nothing is blocking the PR.
#
# 🏷️ Arming also puts the `ci run full` label on, because that label is itself
# required to merge into main (full.yaml): a PR told to merge itself would
# otherwise sit at a red check waiting for a label nobody was going to add. The
# label goes on with the PAT secret rather than GITHUB_TOKEN, since a label
# added by GITHUB_TOKEN wakes no workflow and the full run would never start.
#
# 🔒 The release PR is deliberately left out of all this: it is admin-gated
# behind the STABLE_RELEASES variable (see docs/developer/ci/releasing.md). It has
# no `automerge` label, so this workflow never touches it. Do not add one.

on:
  pull_request:
    # auto_merge_enabled/disabled keep the label honest when auto-merge is
    # armed some other way -- the button on the PR, or `gh pr merge --auto`.
    # `unlabeled` is the mirror of that: taking the label off has to actually
    # disarm, or the PR merges anyway and the label is a lie.
    #
    # `labeled` and `unlabeled` fire for every label on the repo, and GitHub
    # gives no way to filter the trigger by name, so the one job below checks
    # `github.event.label` and stands down for labels that are none of its
    # business. Skipping is safe here in a way it is not for CI or E2E: this is
    # not a required check, so a skip overwrites nothing that branch protection
    # reads. One job rather than three, because every job in a workflow shows
    # up as a check on the PR, skipped or not, and three names per label event
    # was most of the clutter on every pull request.
    #
    # No `opened`, `reopened` or `synchronize`: a label added at creation still
    # fires `labeled`, and once armed, auto-merge survives new commits on its
    # own. Every event this listens to is one that could change the answer.
    types: [labeled, unlabeled, ready_for_review, auto_merge_enabled, auto_merge_disabled]

permissions:
  contents: write
  pull-requests: write

env:
  FULL_LABEL: ci run full

jobs:
  # One job, three concerns, each a step that only runs for its own event:
  #   - auto_merge_enabled/disabled: keep the label honest. Cannot loop: adding
  #     the label wakes the arm step, which finds auto-merge armed and stops;
  #     removing it wakes the disarm step, which finds it off and stops.
  #   - unlabeled (automerge): disarm, or the PR merges itself anyway.
  #   - the label present and the PR not a draft: arm.
  automerge:
    name: Auto-merge
    # Stand down entirely for a label that is none of this workflow's business,
    # so the run is a single skipped check rather than three.
    if: github.event.action != 'labeled' || github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    steps:
      - name: Match the label to the state
        if: github.event.action == 'auto_merge_enabled' || github.event.action == 'auto_merge_disabled'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # Check before editing. `disarm` takes the label off and then turns
          # auto-merge off, which wakes this job with the label already gone;
          # without this, the run would report that it removed a label that was
          # not there.
          has=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | index("automerge") != null')
          if [ "$ACTION" = "auto_merge_enabled" ]; then
            [ "$has" = "true" ] && { echo "Label is already on. Nothing to do." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            gh pr edit "$PR" --add-label automerge
            note="Auto-merge was armed elsewhere, so the \`automerge\` label now says so."
          else
            [ "$has" = "false" ] && { echo "Label is already off. Nothing to do." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            gh pr edit "$PR" --remove-label automerge
            note="Auto-merge was turned off, so the \`automerge\` label came off with it."
          fi
          {
            echo "## 🏷️ Auto-merge"
            echo ""
            echo "> ▶️ **Why this ran:** \`${ACTION}\` on #${PR}."
            echo ""
            echo "$note"
          } >> "$GITHUB_STEP_SUMMARY"

  # The label came off. Auto-merge does not come off with it on its own, so a PR
  # that no longer claims to be auto-merging would still merge itself the moment
  # the checks went green -- which is the opposite of what taking the label off
  # is asking for.

      - name: Turn auto-merge off
        if: github.event.action == 'unlabeled' && github.event.label.name == 'automerge'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          {
            echo "## 🏷️ Auto-merge"
            echo
            echo "> ▶️ **Why this ran:** the \`automerge\` label came off [#${PR}](${URL})."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Nothing to turn off: the label was decorative, or `auto_merge_disabled`
          # already fired and the `label` job took the label off in response.
          state=$(gh pr view "$PR" --json state,autoMergeRequest --jq '.state + " " + ((.autoMergeRequest != null) | tostring)')
          if [ "${state#* }" != "true" ]; then
            echo "✅ Auto-merge was not armed. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${state%% *}" != "OPEN" ]; then
            echo "✅ PR is ${state%% *}, not open. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh pr merge "$PR" --disable-auto 2>err.txt; then
            echo "✅ Disarmed. This PR will not merge itself. Add the label back to re-arm." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Failing here matters more than it does in `arm`: a silent failure
          # leaves a PR that merges itself after someone asked it not to.
          {
            echo "❌ Could not disarm auto-merge. **This PR may still merge itself.**"
            echo
            echo '```'
            cat err.txt
            echo '```'
            echo
            echo "Turn it off by hand on the pull request."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Enable auto-merge
        if: contains(github.event.pull_request.labels.*.name, 'automerge') && !github.event.pull_request.draft && github.event.action != 'auto_merge_disabled' && github.event.action != 'unlabeled' && (github.event.action != 'labeled' || github.event.label.name == 'automerge')
        env:
          GH_TOKEN: ${{ github.token }}
          # There is no checkout in this job, so gh cannot work out the repo from
          # a git remote. GH_REPO tells it directly, which is cheaper than
          # cloning the tree just to run two API calls.
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          {
            echo "## 🏷️ Auto-merge"
            echo
            echo "> ▶️ **Why this ran:** \`${{ github.event.action }}\` on [#${PR}](${URL}), which carries the \`automerge\` label."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Already armed by an earlier run, or merged while this one queued.
          state=$(gh pr view "$PR" --json state,autoMergeRequest --jq '.state + " " + ((.autoMergeRequest != null) | tostring)')
          if [ "${state#* }" = "true" ]; then
            echo "✅ Auto-merge is already armed. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${state%% *}" != "OPEN" ]; then
            echo "✅ PR is ${state%% *}, not open. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh pr merge "$PR" --auto --squash 2>err.txt; then
            {
              echo "✅ Armed. GitHub will squash-merge this PR as soon as every required check passes,"
              echo "and delete the branch afterwards. Remove the \`automerge\` label to cancel."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The usual cause is a PR that nothing is blocking, which GitHub will
          # not arm. Say so rather than failing the run over it.
          {
            echo "⚠️ Could not arm auto-merge:"
            echo
            echo '```'
            cat err.txt
            echo '```'
            echo
            echo "If this says the pull request is not in a mergeable state, check that"
            echo "\`main\` still requires the **Lint, test & build** check: with nothing"
            echo "blocking a PR there is nothing for auto-merge to wait on."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Whichever way auto-merge came on -- the step above, or the button on
      # the PR -- the full run has to be asked for, or the merge waits on a red
      # `CI run full` for ever. Checked against the live state rather than the
      # event, so it is idempotent and safe to run after either path.
      - name: Ask for the full run
        if: github.event.action != 'unlabeled' && github.event.action != 'auto_merge_disabled'
        env:
          # PAT so the `labeled` event actually fires full.yaml. Falls back to
          # GITHUB_TOKEN, which adds the label but wakes nothing -- the summary
          # says so, and the next push starts the run instead.
          GH_TOKEN: ${{ secrets.PAT || github.token }}
          HAVE_PAT: ${{ secrets.PAT != '' }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --json state,autoMergeRequest,labels --jq \
            ".state + \" \" + ((.autoMergeRequest != null) | tostring) + \" \" + (([.labels[].name] | index(\"${FULL_LABEL}\") != null) | tostring)")
          read -r open armed labelled <<< "$state"
          [ "$open" = "OPEN" ] || exit 0
          if [ "$armed" != "true" ]; then
            echo "Auto-merge is not armed, so the \`${FULL_LABEL}\` label is left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$labelled" = "true" ]; then
            echo "🏷️ \`${FULL_LABEL}\` is already on, so the full run is already asked for." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr edit "$PR" --add-label "$FULL_LABEL"
          if [ "$HAVE_PAT" = "true" ]; then
            echo "🏷️ Added \`${FULL_LABEL}\`: merging into main needs the ten-Firefox run, and it starts now." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Added \`${FULL_LABEL}\` with GITHUB_TOKEN, which wakes no workflow: the full run starts on the next push. Set the \`PAT\` secret to have it start now." >> "$GITHUB_STEP_SUMMARY"
          fi
