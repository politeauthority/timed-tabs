name: Release Please
run-name: "Release Please — ${{ github.event_name == 'workflow_dispatch' && 'dispatched' || github.ref_name }}"

# Mirrors quigley-web: release-please maintains a release PR from Conventional
# Commits; merging it tags the version and (package) builds the Firefox + Chrome
# zips and attaches them to the GitHub Release.
#
# timed-tabs is NOT containerised, so there is no image build, no Harbor login and
# no kubectl deploy. Jobs run on the self-hosted `timed-tabs` ARC scale set, like
# quigley-web; Force Release stays on `ubuntu-latest` because it is git-only.
#
# 🔒 ADMIN GATE. Unlike quigley-web, the release PR is NOT merged automatically the
# moment it appears. Nothing is tagged, released or packaged until someone with
# **admin** permission on this repo clears it, in one of two ways:
#
#   1. an APPROVED review on the release PR, or
#   2. the `release-approved` label applied to it.
#
# The label exists because GitHub refuses to let anyone approve their own pull
# request, and release-please opens this PR with the PAT — so while the PAT's owner
# is the only admin, route 1 is impossible and route 2 is the only way through.
#
# Both are checked against the PR's CURRENT head commit: an approval must name that
# commit, and the label must have been applied after it was committed. A stale
# approval or a stale label left on an earlier version cannot release a later one.
#
# (GitHub Environments with required reviewers would be the native way to do this,
# but required-reviewer protection rules need Pro/Team on a private repo — the API
# refuses with a billing error — so the gate is enforced here instead.)
#
# The merge itself must re-trigger this workflow so the second run cuts the tag, and
# GITHUB_TOKEN-caused pushes do NOT trigger workflows — hence `secrets.PAT`.
#
# ⚠️ PREREQ: the `PAT` secret must exist, and the repo must allow rebase merging
# (Settings → General → Pull Requests).
#
# ⏸️ STABLE RELEASES ARE PAUSED while the project is still in development. The
# release PR is still maintained (the Beta Release workflow reads the next version
# from its title), but the gated merge only runs when the repository variable
# STABLE_RELEASES is "true" (Settings → Secrets and variables → Actions → Variables).
# Until then every release is a beta. Do not merge the release PR by hand: the next
# run would tag it as a stable release.
on:
  push:
    branches: ["main"]
  # The two things that clear the gate -- an approving review on the release PR,
  # or the `release-approved` label -- arrive as a dispatch from pause.yaml, the
  # one small workflow that listens to every PR event. Listening here directly
  # put five skipped jobs on every pull request for every label and review.
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # the step-times action reads this run's job timings
  pull-requests: write
  issues: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    # A review submission or a label never changes what should be released — they
    # only unblock the merge — so release-please itself sits out those runs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.PAT }}      # PAT (not github.token): the gated merge below must re-trigger this workflow
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: 📋 Summary
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then WHY="a manual dispatch"; else WHY="a push to \`main\`"; fi
          if [ "${{ steps.rp.outputs.release_created }}" = "true" ]; then
            {
              echo "# 🚀 Release Please — released \`${{ steps.rp.outputs.tag_name }}\`"
              echo ""
              echo "> ▶️ **Why this ran:** ${WHY} — an admin-approved release PR was merged, so the tag + GitHub Release were created."
              echo ""
              echo "➡️ The **Package extension** job is running now to build and attach the Firefox + Chrome zips."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# 🧾 Release Please — release PR maintained (nothing released)"
              echo ""
              echo "> ▶️ **Why this ran:** ${WHY} — release-please maintains the release PR from Conventional Commits."
              echo ""
              echo "No version was cut on this run. See the **Admin-gated merge** job for whether the"
              echo "pending release PR is waiting on an approval."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  paused:
    name: Stable releases paused
    needs: release-please
    # A one-line notice: no need to wake a self-hosted runner for it, and no
    # need to say it again on every label or review event.
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.STABLE_RELEASES != 'true' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Summary
        run: |
          {
            echo "## ⏸️ Stable releases are paused"
            echo ""
            echo "The release PR is kept up to date so **Beta Release** can name its builds, but it is not merged."
            echo "Cut a beta from the Actions tab instead. To resume stable releases, set the repository"
            echo "variable \`STABLE_RELEASES\` to \`true\`."
          } >> "$GITHUB_STEP_SUMMARY"

  gated-merge:
    name: Admin-gated merge
    needs: release-please
    # Runs on pushes to main AND on the dispatch pause.yaml sends when a review or
    # the `release-approved` label lands on the release PR, so the release goes out
    # whichever happens last: the approval, or a later commit on an already-approved
    # PR. Skipped on the post-merge run (a release was just cut — nothing to merge),
    # and skipped entirely while stable releases are paused (see the header).
    if: >-
      always() && vars.STABLE_RELEASES == 'true'
      && needs.release-please.result != 'failure'
      && needs.release-please.outputs.release_created != 'true'
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    steps:
      # No checkout in this job otherwise; fetch only what the action needs.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/gh-cli
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gh-cli

      - name: Merge the release PR if an admin has cleared it
        env:
          GH_TOKEN: ${{ secrets.PAT }}   # PAT so the merge push re-triggers this workflow
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The pending release PR, identified by release-please's branch prefix.
          PR=$(gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number // empty')
          if [ -z "$PR" ]; then
            echo "✅ No open release PR — nothing to merge."
            {
              echo "## 🔒 Admin-gated merge"
              echo ""
              echo "> ▶️ **Why this ran:** ${{ github.event_name }} — checking whether a release PR is ready to merge."
              echo ""
              echo "No open release PR. Nothing to do."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          TITLE=$(gh pr view "$PR" --repo "$REPO" --json title --jq '.title')
          echo "Release PR #${PR} (${TITLE}) at ${HEAD_SHA}"

          # Approvals on the CURRENT head only. release-please rewrites the PR branch
          # whenever main moves, so an approval left on an older version must not
          # release a newer one.
          APPROVERS=$(gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
            --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"${HEAD_SHA}\") | .user.login] | unique | .[]")

          ADMIN=""
          VIA=""
          for who in $APPROVERS; do
            PERM=$(gh api "repos/${REPO}/collaborators/${who}/permission" --jq '.permission' 2>/dev/null || echo "none")
            echo "approver ${who} → permission ${PERM}"
            if [ "$PERM" = "admin" ]; then ADMIN="$who"; VIA="an approving review"; break; fi
          done

          # The other way through: the `release-approved` label, applied by an admin.
          # GitHub refuses to let anyone approve their own pull request, and release-please
          # opens this one with the PAT, so on a repo whose only admin is the PAT's owner
          # the review path above can never be satisfied. A label from an admin says the
          # same thing and is checked just as strictly.
          STALE_LABEL=""
          if [ -z "$ADMIN" ]; then
            LABELLED=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name] | index("release-approved") != null')
            if [ "$LABELLED" = "true" ]; then
              # Labels do not move when the branch does, so the label must be newer than
              # the commit it is meant to release. release-please rewrites this branch
              # whenever main moves, and a label left on an earlier version must not
              # release a later one.
              HEAD_AT=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.committer.date')
              EVENTS_JQ='[.[] | select(.event == "labeled" and .label.name == "release-approved")] | last'
              WHO=$(gh api "repos/${REPO}/issues/${PR}/events" --paginate --jq "${EVENTS_JQ} | .actor.login // empty")
              WHEN=$(gh api "repos/${REPO}/issues/${PR}/events" --paginate --jq "${EVENTS_JQ} | .created_at // empty")
              PERM=$(gh api "repos/${REPO}/collaborators/${WHO}/permission" --jq '.permission' 2>/dev/null || echo "none")
              echo "label applied by ${WHO:-?} (${PERM}) at ${WHEN:-?}; head committed at ${HEAD_AT}"
              if [ "$PERM" = "admin" ] && [[ -n "$WHEN" && "$WHEN" > "$HEAD_AT" ]]; then
                ADMIN="$WHO"
                VIA="the \`release-approved\` label"
              elif [ "$PERM" = "admin" ]; then
                STALE_LABEL="${WHO} labelled this at ${WHEN}, before the current head commit (${HEAD_AT}). Remove the label and apply it again."
              else
                STALE_LABEL="${WHO:-whoever} applied the label but is not an admin (${PERM})."
              fi
            fi
          fi

          if [ -z "$ADMIN" ]; then
            echo "⏸️ Release PR #${PR} has not been cleared by an admin on its current head — not merging."
            {
              echo "## ⏸️ 🔒 Waiting for admin clearance"
              echo ""
              echo "> ▶️ **Why this ran:** ${{ github.event_name }} — checking whether the release PR is cleared to merge."
              echo ""
              echo "**[#${PR} — ${TITLE}](${{ github.server_url }}/${REPO}/pull/${PR})** is ready but **not released**."
              echo ""
              echo "An **admin** clears it either way, on commit \`$(echo "$HEAD_SHA" | cut -c1-7)\`:"
              echo ""
              echo "- leave an \`APPROVED\` review on the PR, or"
              echo "- apply the \`release-approved\` label — the way through when the only admin is"
              echo "  the PR's own author, since GitHub refuses to let anyone approve their own PR."
              echo ""
              echo "Either one re-triggers this workflow, which then merges, tags and packages."
              if [ -n "$APPROVERS" ]; then
                echo ""
                echo "Approved on this commit, but not admins: $(echo $APPROVERS | tr ' ' ',')"
              fi
              if [ -n "$STALE_LABEL" ]; then
                echo ""
                echo "⚠️ The \`release-approved\` label is on the PR but does not count: ${STALE_LABEL}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::notice::Release PR #${PR} cleared by admin ${ADMIN} via ${VIA} — merging."
          # A 403 here almost always means the PAT can write contents/PRs but isn't
          # allowed to merge — regenerate it as a classic PAT with `repo` (+`workflow`)
          # scope, or fine-grained with Contents + Pull requests R/W.
          gh pr merge "$PR" --repo "$REPO" --rebase \
            || { echo "::error::Failed to merge release PR #${PR}"; exit 1; }
          {
            echo "## ✅ 🔒 Admin-cleared — release PR merged"
            echo ""
            echo "> ▶️ **Why this ran:** ${{ github.event_name }} — **${ADMIN}** (admin) cleared the release PR with ${VIA}, so it was merged."
            echo ""
            echo "Merged **[#${PR} — ${TITLE}](${{ github.server_url }}/${REPO}/pull/${PR})**."
            echo "➡️ That push to \`main\` re-triggers this workflow, whose next run cuts the tag and attaches the zips."
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package extension
    needs: release-please
    # Runs only once a release actually got cut. This is where quigley-web builds +
    # pushes its image and deploys; timed-tabs has nothing to deploy, so it builds
    # the two browser zips and attaches them to the GitHub Release instead.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    permissions:
      contents: write        # gh release upload
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      # As in the beta job: the action from this ref, in a path of its own.
      - uses: actions/checkout@v7
        with:
          path: .gh-cli
          sparse-checkout: |
            .github/actions/gh-cli
            .github/actions/node-toolcache
          sparse-checkout-cone-mode: false
      - uses: ./.gh-cli/.github/actions/gh-cli
      - uses: ./.gh-cli/.github/actions/node-toolcache
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build zips
        run: |
          npm run package     # -> web-ext-artifacts/timed-tabs-{firefox,chrome}-<version>.zip
          npx web-ext lint --source-dir dist/firefox   # lint what ships, not src/
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          ls -la web-ext-artifacts
          gh release upload "$TAG" web-ext-artifacts/*.zip --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload zips as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: timed-tabs-${{ needs.release-please.outputs.version }}
          path: web-ext-artifacts/*.zip
      - name: 📋 Release summary
        if: always()
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          if [ "${{ job.status }}" = "success" ]; then s="✅ packaged"; else s="❌ failed"; fi
          {
            echo "# 🚀 Released v${VERSION} ${s}"
            echo ""
            echo "> ▶️ **Why this ran:** an admin-approved release PR was merged, cutting \`${TAG}\` — so the extension zips are built and attached to the release."
            echo ""
            echo "| 🏷️ Version | 🦊 Firefox | 🌐 Chrome |"
            echo "| --- | --- | --- |"
            echo "| \`v${VERSION}\` | \`timed-tabs-firefox-${VERSION}.zip\` | \`timed-tabs-chrome-${VERSION}.zip\` |"
            echo ""
            echo "📦 Attached to the [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}), unsigned. ➡️ The **Publish to AMO** job runs next; it uploads the version to the listing when the AMO credentials are set."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-amo:
    name: Publish to AMO
    needs: [release-please, package]
    # Only after a release was cut and its zips were attached. The upload is the
    # same artefact the package job built, rebuilt from the tag rather than passed
    # between jobs, so what AMO gets is what `npm run package` produces at that tag.
    #
    # 💤 DORMANT UNTIL THE LISTING EXISTS. The AMO API can only add a version to an
    # add-on that is already listed, and the first submission is manual (see
    # docs/personal/amo-publishing.md). Without AMO_JWT_ISSUER and AMO_JWT_SECRET
    # this job skips its work and says so, which is also what forks get.
    #
    # ⚠️ AMO refuses a version number it has already seen, even one whose upload
    # failed validation. A failed publish is fixed by cutting the next patch
    # release, never by re-running this job.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    steps:
      # `secrets` is not available in a job-level `if`, so the gate is a step.
      - name: Are the AMO credentials present?
        id: creds
        env:
          ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$ISSUER" ] && [ -n "$SECRET" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AMO credentials are not set — skipping the upload."
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.have == 'true'
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.have == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.creds.outputs.have == 'true'
      - name: Build the Firefox target
        if: steps.creds.outputs.have == 'true'
        run: npm run build:firefox     # -> dist/firefox, the one whose id matches the listing

      - name: Upload the version to AMO
        id: sign
        if: steps.creds.outputs.have == 'true'
        env:
          # web-ext reads the credentials from the environment, so they never
          # appear in a command line or a log.
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          # --channel listed adds a version to the public listing; unlisted would
          # sign a self-hosted build instead. --approval-timeout 0 returns as soon
          # as AMO accepts the upload rather than waiting out the review.
          npx web-ext sign \
            --source-dir dist/firefox \
            --channel listed \
            --approval-timeout 0 \
            --artifacts-dir web-ext-artifacts/amo

      - name: 📋 AMO summary
        if: always()
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          if [ "${{ steps.creds.outputs.have }}" != "true" ]; then
            {
              echo "## 💤 AMO publish skipped"
              echo ""
              echo "> ▶️ **Why this ran:** v${VERSION} was released, so this job offers to push it to AMO."
              echo ""
              echo "\`AMO_JWT_ISSUER\` and \`AMO_JWT_SECRET\` are not set, so nothing was uploaded."
              echo "The listing has to exist before the API can add versions to it — the first"
              echo "submission is manual."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.sign.outcome }}" = "success" ]; then
            {
              echo "## 🦊 Published v${VERSION} to AMO"
              echo ""
              echo "> ▶️ **Why this ran:** v${VERSION} was released, so the Firefox build was uploaded to the listing."
              echo ""
              echo "AMO has accepted the upload. Review happens on their side; the version appears"
              echo "on the listing once it passes."
              echo ""
              echo "🔗 [Developer hub](https://addons.mozilla.org/developers/addons)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ❌ AMO publish failed"
              echo ""
              echo "> ▶️ **Why this ran:** v${VERSION} was released, so the Firefox build was to be uploaded to AMO."
              echo ""
              echo "**Do not re-run this job.** AMO remembers a version number even when its upload"
              echo "failed, so v${VERSION} can never be uploaded again. Fix the cause and cut the"
              echo "next patch release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
