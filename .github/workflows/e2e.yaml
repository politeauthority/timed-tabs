name: E2E
run-name: "E2E — ${{ github.ref_name }}"

# 🦊 Runs the extension in a real, headless Firefox on the self-hosted runner and
# checks each scenario in tests/e2e/scenarios against the log it produces. See
# docs/developer/e2e.md.
#
# This is a reusable workflow with no triggers of its own. `jobs.e2e` in ci.yaml
# calls it, with `needs: lint-test`, so Firefox is only installed once lint, the unit
# tests and the build are green: a branch that does not compile never spends the
# minutes. When it runs is decided there, and only there. It stays in its own file
# because the Firefox plumbing below is long enough to bury the rest of CI, and it
# keeps workflow_dispatch so a Firefox-only run is still one click.
#
# Two versions of Firefox, in parallel: the current release and the one before it.
# Both are resolved at run time from Mozilla's product-details feed rather than
# pinned, so "previous" follows every release without anyone editing this file. Both
# must pass.
#
# The scenarios run as a matrix, but the status check is the `report` job at the
# bottom, which is the one branch protection matches. That indirection is the point:
# a matrix leg's name carries its matrix values, so making the legs the required
# check would rename it on every version change. Called, `report` shows as
# `E2E / headless Firefox` -- GitHub prefixes a called workflow's jobs with the
# calling job's name, and that whole string is the required context. Renaming either
# half stops the check being required. Dispatched rather than called, it reports
# under its bare name.
#
# A PR labelled "ci pause" skips the job. The job is a required status check, and
# GitHub counts a skipped required check as passed, so the label lets a PR merge
# without waiting for Firefox while still leaving the check in place for every other
# PR. CI does not wake on label events, so applying "ci pause" does not retroactively
# skip a run that already happened; it does not need to, because the `Not paused`
# check goes red the moment the label lands and no paused PR can merge anyway. The
# next push picks the label up.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # the step-times action reads this run's job timings

env:
  FIREFOX_LIBS_KEY: v1

# No concurrency group. Called from CI this job is part of the caller's run, and
# `ci-<ref>` already cancels the whole thing when a newer commit lands; a group here
# would only be a second way to say the same thing, scoped to a different key.

jobs:
  scenarios:
    name: Firefox ${{ matrix.firefox }}
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci pause')
    timeout-minutes: 20
    strategy:
      # Not fail-fast: when one version breaks, the first thing worth knowing is
      # whether the other one broke too. Cancelling it throws that away.
      fail-fast: false
      matrix:
        firefox: [latest, previous]
    steps:
      # Full history: the changed-paths action diffs against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Like CI: the job always runs and reports, because it is a required
      # check, but on a docs-only change it skips the work. Firefox is not
      # going to notice a README.
      - uses: ./.github/actions/changed-paths
        id: changed

      # The runner node is short of CPU, not bandwidth: unpacking Node took two
      # minutes and apt nine on a busy day. So the caches below hold the
      # unpacked results. Node's tool directory comes back with one zstd untar
      # and setup-node then finds it without downloading or extracting; the
      # Firefox libraries come back as installed files, skipping dpkg entirely.
      - uses: ./.github/actions/node-toolcache
        if: steps.changed.outputs.code == 'true'
        id: node
        timeout-minutes: 4
        with:
          # Both legs of the matrix are the same `github.job`, so without this
          # they would share a key and race to save it on a cold cache.
          key-suffix: "-${{ matrix.firefox }}"
      - name: npm ci
        if: steps.changed.outputs.code == 'true'
        id: npm
        timeout-minutes: 4
        run: npm ci --prefer-offline --no-audit --no-fund

      # Firefox's system libraries. Installed once, then cached as a tarball of
      # every file the install put down, so later runs untar instead of running
      # apt and dpkg (nine minutes on a starved CPU). Bump FIREFOX_LIBS_KEY after
      # changing the package list. Ubuntu 24.04: ALSA is libasound2t64.
      - id: os
        if: steps.changed.outputs.code == 'true'
        # The library tarball is untarred over /, so its key must carry the OS
        # release it was built on.
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"
      - name: Restore the Firefox libraries
        if: steps.changed.outputs.code == 'true'
        id: libs
        uses: actions/cache/restore@v5
        with:
          path: ~/firefox-libs.tar
          # Ends in the matrix leg for the same reason the Node key does: both
          # legs are cold at once on a fresh key, and both would try to save.
          # The system libraries do not depend on which Firefox runs, so the
          # prefix lets either leg restore whatever the other one cached.
          key: firefox-libs-${{ runner.os }}-${{ runner.arch }}-${{ steps.os.outputs.id }}-${{ env.FIREFOX_LIBS_KEY }}-${{ matrix.firefox }}
          restore-keys: |
            firefox-libs-${{ runner.os }}-${{ runner.arch }}-${{ steps.os.outputs.id }}-${{ env.FIREFOX_LIBS_KEY }}-
      - name: Firefox libraries
        if: steps.changed.outputs.code == 'true'
        id: firefox-libs
        timeout-minutes: 6
        env:
          PACKAGES: libgtk-3-0 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6 libpci3 libxtst6 libxrandr2 libxcomposite1 libxdamage1 libgbm1 libnss3 libxss1 bzip2 xz-utils
        run: |
          set -euo pipefail
          if [ -f ~/firefox-libs.tar ]; then
            sudo tar -C / -xpf ~/firefox-libs.tar
            sudo ldconfig
            echo "restored $(tar -tf ~/firefox-libs.tar | wc -l) files from the cache"
            exit 0
          fi
          # The runner pod cannot reach the Ubuntu mirrors on port 80 (no IPv6
          # route, and IPv4 connections fail too), while HTTPS is fine. Point
          # apt at an HTTPS mirror and keep it on IPv4.
          sudo sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.kernel.org/ubuntu/#g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          { grep -h "^URIs:\|^deb " /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true; } | sort -u | head -3
          APT="-o Acquire::ForceIPv4=true -o Acquire::Retries=3"
          sudo apt-get $APT update -qq
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT install -y -qq $PACKAGES > /dev/null
          # Everything apt installed just now, dependencies included, from its history.
          # Entries read "pkg:amd64 (1.2-3, automatic)"; drop the parentheses, then split.
          NEW=$({ awk '/^Install:/{line=$0} END{print line}' /var/log/apt/history.log 2>/dev/null || true; } | sed -E 's/^Install: //; s/ \([^)]*\)//g' | tr ',' '\n' | sed -E 's/^ *//; s/:[a-z0-9]+$//' | { grep -E '^[a-z0-9.+-]+$' || true; } | sort -u)
          if [ -z "$NEW" ]; then
            echo "apt installed nothing new (already present on this image); nothing to cache"
            exit 0
          fi
          echo "$NEW" | tr '\n' ' '; echo
          # shellcheck disable=SC2086
          dpkg -L $NEW | sort -u | while read -r f; do if [ -f "$f" ] || [ -L "$f" ]; then echo "$f"; fi; done > ~/firefox-libs.list
          sed 's#^/##' ~/firefox-libs.list > ~/firefox-libs.rel
          sudo tar -C / -cpf ~/firefox-libs.tar --no-recursion -T ~/firefox-libs.rel
          echo "packed $(wc -l < ~/firefox-libs.list) files for the cache"
          echo "packed=true" >> "$GITHUB_OUTPUT"
      - name: Save the Firefox libraries
        if: always() && steps.firefox-libs.outputs.packed == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/firefox-libs.tar
          key: ${{ steps.libs.outputs.cache-primary-key }}

      # Which Firefox this leg tests. Both legs resolve an exact version from the
      # same feed rather than one asking setup-firefox for "latest": that keeps
      # "previous" defined as one major behind the version actually under test,
      # and puts the number in the log and the summary instead of leaving it to
      # be guessed from a run date.
      - name: Resolve the Firefox version
        if: steps.changed.outputs.code == 'true'
        id: ffver
        timeout-minutes: 2
        env:
          WANT: ${{ matrix.firefox }}
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import json, os, re, sys, urllib.request

          want = os.environ["WANT"]
          url = "https://product-details.mozilla.org/1.0/firefox.json"
          with urllib.request.urlopen(url, timeout=30) as r:
              releases = json.load(r)["releases"]

          # Shipped desktop releases only: "major" is x.0, "stability" the x.0.y
          # that follow. Betas, ESRs and devedition carry letters and are dropped
          # by the pattern.
          versions = sorted(
              {
                  rel["version"]
                  for rel in releases.values()
                  if rel.get("product") == "firefox"
                  and rel.get("category") in ("major", "stability")
                  and re.fullmatch(r"\d+(\.\d+)*", rel["version"])
              },
              key=lambda v: tuple(int(n) for n in v.split(".")),
          )
          if not versions:
              sys.exit("product-details returned no usable Firefox releases")

          latest = versions[-1]
          if want == "latest":
              print(latest)
              sys.exit(0)

          # One major back, and the last point release of it: 155.0.1 -> 154.0.1.
          major = int(latest.split(".")[0]) - 1
          earlier = [v for v in versions if int(v.split(".")[0]) == major]
          if not earlier:
              sys.exit(f"no shipped release found for Firefox {major}")
          print(earlier[-1])
          PY
          )
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${WANT} -> Firefox ${version}"

      # setup-firefox downloads a ~90 MB tarball every run; that took 14s and is
      # the smallest cost here, so it is left alone.
      - uses: browser-actions/setup-firefox@v1
        if: steps.changed.outputs.code == 'true'
        id: firefox
        timeout-minutes: 3
        with:
          firefox-version: ${{ steps.ffver.outputs.version }}
      - run: '"${{ steps.firefox.outputs.firefox-path }}" --version'
        if: steps.changed.outputs.code == 'true'

      - name: Run the scenarios
        if: steps.changed.outputs.code == 'true'
        id: scenarios
        timeout-minutes: 8
        env:
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        id: artifacts
        if: always()
        with:
          # One name per leg. Two uploads under the same name in one run is an
          # error, and when a version fails you want its artifacts on their own.
          name: e2e-artifacts-${{ matrix.firefox }}
          path: e2e-artifacts/
          if-no-files-found: ignore

      # Reads e2e-artifacts/results.json, which scripts/e2e.mjs writes with one
      # record per scenario. The console output of the run is the same data, but
      # it is 2000 lines down inside a log nobody opens on a green run.
      - name: 📋 Summary
        if: always()
        # Values from expressions go through env: pasted into bash they would
        # run as code, and the changed-paths reason contains a file path.
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          REASON: ${{ steps.changed.outputs.reason }}
          WANT: ${{ matrix.firefox }}
          # Empty when the resolve step did not run, which the heading allows for.
          VERSION: ${{ steps.ffver.outputs.version }}
        run: |
          who="Firefox ${WANT}${VERSION:+ (${VERSION})}"
          case "${{ job.status }}" in
            success)
              if [ "${{ steps.changed.outputs.code }}" = "true" ]; then head="### ✅ 🦊 ${who} passed"
              else head="### ⏭️ 🦊 ${who} skipped: ${REASON}"; fi ;;
            cancelled) head="### ⏹️ 🦊 ${who} cancelled (the job timed out, or a newer run took over)" ;;
            *) head="### ❌ 🦊 ${who} failed" ;;
          esac
          {
            echo "$head"
            echo ""
            echo "> ▶️ **Why this ran:** ${EVENT} on \`${REF}\`. Scenarios in \`tests/e2e/scenarios\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.changed.outputs.code }}" = "true" ]; then
            python3 scripts/e2e-summary.py e2e-artifacts/results.json >> "$GITHUB_STEP_SUMMARY" || \
              echo "_No scenario results were written; see the job log._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ⏱️ Step times
        if: always()
        uses: ./.github/actions/step-times
        with:
          token: ${{ github.token }}
          slow-over: 60
          # The same numbers as the steps' timeout-minutes, so a step that hit
          # its limit is named as timed out rather than shown as a bare failure.
          timeouts: "Run ./.github/actions/node-toolcache=4, npm ci=4, Firefox libraries=6, Resolve the Firefox version=2, Run browser-actions/setup-firefox@v1=3, Run the scenarios=8"
          job-timeout: 20

  # The status check. Branch protection matches `E2E / headless Firefox`, and this
  # job is the only thing that carries that name, so the matrix above can grow a
  # third version or rename a leg without touching a protected branch setting.
  #
  # `needs.scenarios.result` is the matrix as a whole: success only when every leg
  # succeeded. The `ci pause` condition is repeated here so a paused PR skips this
  # job too -- a skipped required check is what lets a paused PR merge, and a job
  # that reported success without testing anything would be worse than a skip.
  report:
    name: headless Firefox
    needs: scenarios
    if: always() && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci pause'))
    runs-on: ubuntu-latest   # a verdict on other jobs; nothing here needs the big runner
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          RESULT: ${{ needs.scenarios.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success)
              echo "Every Firefox passed."
              echo "### ✅ 🦊 Every Firefox passed" >> "$GITHUB_STEP_SUMMARY" ;;
            cancelled)
              echo "::error::The scenarios were cancelled; see the matrix jobs."
              echo "### ⏹️ 🦊 Cancelled before every Firefox reported" >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            *)
              echo "::error::At least one Firefox failed; see the matrix jobs for which."
              echo "### ❌ 🦊 At least one Firefox failed" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Which one, and why, is in the \`Firefox latest\` and \`Firefox previous\` jobs above." >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
          esac
