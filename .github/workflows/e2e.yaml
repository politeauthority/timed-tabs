name: E2E
run-name: "E2E — ${{ github.ref_name }}"

# 🦊🌐 Runs the extension in a real, headless browser on the self-hosted runner and
# checks each scenario in tests/e2e/scenarios against the log it produces. See
# docs/developer/ci/e2e.md.
#
# This is a reusable workflow with no triggers of its own. `jobs.e2e` in ci.yaml
# calls it, with `needs: lint-test`, so Firefox is only installed once lint, the unit
# tests and the build are green: a branch that does not compile never spends the
# minutes. When it runs is decided there, and only there. It stays in its own file
# because the Firefox plumbing below is long enough to bury the rest of CI, and it
# keeps workflow_dispatch so a run on a branch is still one click.
#
# One vocabulary of channels for both browsers: `nightly`, `stable` and
# `stable-N` (N majors behind stable: `stable-1` is the release before the
# current one). Firefox resolves them from Mozilla's
# product-details feed and Chrome from the Chrome for Testing feed, at run time,
# so nothing here is pinned and every leg follows the browser's own releases.
# Nightly is Firefox Nightly and Chrome Canary, the two daily builds. The
# `firefox` and `chrome` inputs are the two lists; they default to Firefox stable
# and stable-1 plus Chrome stable, which is what CI and the beta gate run, and
# full.yaml passes nightly, stable, stable-1 and stable-2 of each browser for
# the `ci run full` label. This file runs what it is told and holds no opinion about branches. No
# Chrome leg is a required check yet; making one required is a branch protection
# change, not a change here.
#
# Two jobs, one per browser, and they are deliberate near-copies of each other:
# the same skip logic, caches, record and summary, with only the resolve-and-
# install steps differing. A single job with `if: matrix.browser == ...` on every
# other step was harder to read and named its steps after Firefox while
# installing Chrome. What the two share that is long enough to matter -- the
# system libraries and their cache -- is the browser-libs action. A change to
# one job's plumbing is a change to both.
#
# Each leg is its own status check: called from CI they report as
# `E2E / Firefox stable` and `E2E / Firefox stable-1`, GitHub prefixing a called
# workflow's jobs with the calling job's name. Both are required on main, so both
# halves of each name are load-bearing -- and because a matrix leg's name carries its
# matrix values, changing what the matrix covers renames a protected context.
# Branch protection has to be updated in the same change. Dispatched rather than
# called, the legs report under their bare names.
#
# Three things make a leg skip its work: a PR labelled "ci pause", the release PR
# (release-please's branch only ever carries a CHANGELOG entry and the version,
# which no scenario reads), and CI's legs on a PR to main that carries "ci run
# full", which the full run covers. In every case the leg still runs and reports
# green, by name, with the reason in its summary -- it is a required status check,
# and a check that never reports blocks the PR for ever, while one skipped at the
# job level is not even expanded into its matrix and so never reports under the
# names branch protection is waiting for. See the `skip` step. CI does not wake on
# label events, so a label applied after a run does not rewrite it; the `Not
# paused` and `CI run full` checks are what hold the merge in the meantime, and the
# next push picks the label up.
on:
  workflow_call:
    inputs:
      ref:
        # Empty means "whatever ref this workflow was called on", which is what CI
        # wants: a PR's merge ref, or the commit just pushed to main. The beta
        # release passes an explicit commit instead, because it does not build the
        # ref it was dispatched from -- it resolves `main` to a sha first and ships
        # that, so the scenarios have to run against that sha and not against
        # whatever `main` has become by the time this job starts.
        description: Commit-ish to test. Defaults to the calling ref.
        type: string
        required: false
        default: ""
      firefox:
        # A JSON list, because a workflow input cannot be a real one. Each entry
        # is a channel -- `nightly`, `stable` or `stable-N` -- and
        # becomes one leg named `Firefox <channel>`, which is the status-check
        # context branch protection matches on. `[]` runs no Firefox at all.
        description: 'JSON list of Firefox channels: nightly, stable, stable-N (N majors back).'
        type: string
        required: false
        default: '["stable", "stable-1"]'
      chrome:
        # The same for Chrome. Defaults to stable, so a caller that says nothing
        # -- the beta gate, a bare dispatch -- tests the Chrome build it ships.
        # `[]` runs no Chrome at all, at a price: a matrix job skipped at the job
        # level is not expanded, so it reports once under the literal text of
        # its name expression. Harmless, and odd to look at.
        description: 'JSON list of Chrome channels: nightly, stable, stable-N (N majors back). Empty for none.'
        type: string
        required: false
        default: '["stable"]'
      max-parallel:
        # Ten browsers at once starved one another on the runner node until a
        # scenario saw a single tick in its whole window. The scenarios time
        # things, so contention reads as failure; run fewer legs at a time.
        # Per browser job: the two jobs run beside each other.
        description: How many legs of each browser may run at once.
        type: number
        required: false
        default: 2
      leg-summary:
        # `always` gives every leg its own step summary, which is right for the
        # CI pair. `on-failure` keeps a green leg quiet so the caller can write
        # one table for the lot: full.yaml does, from the leg records each leg
        # uploads (see "Record the leg" below).
        description: When a leg writes its own step summary, `always` or `on-failure`.
        type: string
        required: false
        default: always
      skip-when-full:
        # For CI. A PR to main carrying `ci run full` gets these same versions
        # again inside the full run, and the `CI run full` status holds the
        # merge until that passes -- so CI's legs skip, which a required check
        # reads as a pass, and the runner is spent once. full.yaml leaves this
        # off, since its legs are the ones being counted on.
        description: Skip the legs on a PR to main that carries the `ci run full` label.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Commit-ish to test. Defaults to the branch this is dispatched from.
        type: string
        required: false
        default: ""
      firefox:
        description: 'JSON list of Firefox channels: nightly, stable, stable-N (N majors back).'
        type: string
        required: false
        default: '["stable", "stable-1"]'
      chrome:
        description: 'JSON list of Chrome channels: nightly, stable, stable-N (N majors back). Empty for none.'
        type: string
        required: false
        default: '["stable"]'
      max-parallel:
        description: How many legs of each browser may run at once.
        type: number
        required: false
        default: 2
      leg-summary:
        description: When a leg writes its own step summary, `always` or `on-failure`.
        type: string
        required: false
        default: always
      skip-when-full:
        # Never true on a dispatch, which is not a pull request; declared so
        # that every `inputs.*` the job reads exists for this trigger too.
        description: Skip the legs on a PR to main that carries the `ci run full` label.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read        # the step-times action reads this run's job timings

# No concurrency group. Called from CI this job is part of the caller's run, and
# `ci-<ref>` already cancels the whole thing when a newer commit lands; a group here
# would only be a second way to say the same thing, scoped to a different key.

env:
  BROWSER_LIBS_KEY: v1

jobs:
  firefox:
    name: Firefox ${{ matrix.channel }}
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    # Only when there is a list to run: an empty matrix is an error, not a no-op.
    # This is the one job-level `if` here, and it is safe because an empty list
    # never comes from a caller whose Firefox legs are required checks. (It
    # does leave one skipped check named with the literal `name` expression,
    # which is why the defaults leave no list empty.)
    #
    # Everything else that skips a leg -- the `ci pause` label, the release PR,
    # and CI's legs when the full run covers them -- is decided by the `skip`
    # step inside the job, never here. A matrix job skipped at the job level is
    # not expanded: it reports once, under the literal text of its `name`
    # expression, and the contexts branch protection is waiting for never
    # arrive, so the PR is stuck. Skipping the steps instead leaves each leg
    # reporting, by name, as a pass -- which is what a skip is meant to be.
    if: inputs.firefox != '[]'
    timeout-minutes: 20
    strategy:
      # Not fail-fast: when one version breaks, the first thing worth knowing is
      # whether the others broke too. Cancelling them throws that away.
      fail-fast: false
      # fromJSON, so a dispatch (whose inputs arrive as strings) gives a number too.
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
      matrix:
        channel: ${{ fromJSON(inputs.firefox) }}
    steps:
      # Whether this leg has anything to do, decided before anything is even
      # checked out. A PR labelled `ci pause` is paused; the release PR only
      # carries the CHANGELOG and the version, which no scenario reads (lint and
      # the unit tests still run on it, which is what keeps `web-ext lint` on
      # the bumped manifest before the tag is cut); and CI's legs on a PR to
      # main carrying `ci run full` are covered by the full run, whose status
      # holds the merge until they pass. Each answer is a pass with a reason.
      - id: skip
        env:
          PAUSED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci pause') }}
          RELEASE: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release-please--') }}
          FULL: ${{ github.event_name == 'pull_request' && inputs.skip-when-full && github.event.pull_request.base.ref == 'main' && contains(github.event.pull_request.labels.*.name, 'ci run full') }}
        run: |
          reason=""
          if [ "$PAUSED" = "true" ]; then reason="the \`ci pause\` label is on this pull request."
          elif [ "$RELEASE" = "true" ]; then reason="the release PR only carries the CHANGELOG and the version, which no scenario reads."
          elif [ "$FULL" = "true" ]; then reason="the \`ci run full\` label is on, so the full run tests this version and more; the \`CI run full\` status holds the merge until it passes."
          fi
          echo "skip=$([ -n "$reason" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          [ -z "$reason" ] || echo "skipping: ${reason}"

      # Full history: the changed-paths action diffs against the base commit.
      - uses: actions/checkout@v7
        if: steps.skip.outputs.skip != 'true'
        with:
          # actions/checkout treats an empty ref as "unset", so the default keeps
          # the behaviour this job had before the input existed.
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Like CI: the job always runs and reports, because it is a required
      # check, but on a docs-only change it skips the work. A browser is not
      # going to notice a README.
      - uses: ./.github/actions/changed-paths
        if: steps.skip.outputs.skip != 'true'
        id: changed

      # The one verdict every step below reads: run, or skip with this reason.
      - id: go
        env:
          SKIP: ${{ steps.skip.outputs.skip }}
          SKIP_REASON: ${{ steps.skip.outputs.reason }}
          CODE: ${{ steps.changed.outputs.code }}
          CODE_REASON: ${{ steps.changed.outputs.reason }}
        run: |
          if [ "$SKIP" = "true" ]; then run=false; reason="$SKIP_REASON"
          elif [ "$CODE" = "true" ]; then run=true; reason="$CODE_REASON"
          else run=false; reason="$CODE_REASON"; fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      # The runner node is short of CPU, not bandwidth: unpacking Node took two
      # minutes and apt nine on a busy day. So the caches hold the unpacked
      # results. Node's tool directory comes back with one zstd untar and
      # setup-node then finds it without downloading or extracting; the browser
      # libraries come back as installed files, skipping dpkg entirely.
      - uses: ./.github/actions/node-toolcache
        if: steps.go.outputs.run == 'true'
        id: node
        timeout-minutes: 4
        with:
          # Every leg of the matrix is the same `github.job`, so without this
          # they would share a key and race to save it on a cold cache.
          key-suffix: "-firefox-${{ matrix.channel }}"
      - name: npm ci
        if: steps.go.outputs.run == 'true'
        id: npm
        timeout-minutes: 4
        run: npm ci --prefer-offline --no-audit --no-fund

      # The system libraries, from the cache when it has them. One list and one
      # cache for both browsers; see the action.
      - uses: ./.github/actions/browser-libs
        if: steps.go.outputs.run == 'true'
        timeout-minutes: 6
        with:
          key: ${{ env.BROWSER_LIBS_KEY }}
          leg: firefox-${{ matrix.channel }}

      # Which Firefox this leg tests, as an exact number from Mozilla's feed
      # rather than by asking setup-firefox for "latest": that keeps "stable-1"
      # defined relative to the version actually under test, and puts the
      # number in the log. Nightly is the exception -- there is no number to
      # resolve, so setup-firefox is asked for today's build by name and the
      # "Which Firefox" step reads what it got.
      - name: Resolve the Firefox version
        if: steps.go.outputs.run == 'true'
        id: resolve
        timeout-minutes: 2
        env:
          WANT: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import json, os, re, sys, urllib.request

          want = os.environ["WANT"]
          url = "https://product-details.mozilla.org/1.0/firefox.json"
          with urllib.request.urlopen(url, timeout=30) as r:
              releases = json.load(r)["releases"]

          # Shipped desktop releases only: "major" is x.0, "stability" the x.0.y
          # that follow. Betas, ESRs and devedition carry letters and are dropped
          # by the pattern.
          versions = sorted(
              {
                  rel["version"]
                  for rel in releases.values()
                  if rel.get("product") == "firefox"
                  and rel.get("category") in ("major", "stability")
                  and re.fullmatch(r"\d+(\.\d+)*", rel["version"])
              },
              key=lambda v: tuple(int(n) for n in v.split(".")),
          )
          if not versions:
              sys.exit("product-details returned no usable Firefox releases")

          stable = versions[-1]
          if want == "stable":
              print(stable)
              sys.exit(0)
          if want == "nightly":
              print("latest-nightly")
              sys.exit(0)

          # N majors back, and the last point release of that major: with 155.0.1
          # current, `stable-1` is 154.0.1 and `stable-2` is 153.x.
          m = re.fullmatch(r"stable-([1-9]\d*)", want)
          if not m:
              sys.exit(f"unknown Firefox channel {want!r}: use nightly, stable or stable-N")
          major = int(stable.split(".")[0]) - int(m.group(1))
          earlier = [v for v in versions if int(v.split(".")[0]) == major]
          if not earlier:
              sys.exit(f"no shipped release found for Firefox {major}")
          print(earlier[-1])
          PY
          )
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${WANT} -> Firefox ${version}"

      # setup-firefox downloads a ~90 MB tarball every run; that took 14s and is
      # the smallest cost here, so it is left alone.
      - uses: browser-actions/setup-firefox@v1
        if: steps.go.outputs.run == 'true'
        id: install
        timeout-minutes: 3
        with:
          firefox-version: ${{ steps.resolve.outputs.version }}

      # What actually got installed, as the number the table and summary show:
      # "Mozilla Firefox 157.0a1" / "Google Chrome for Testing 154.0.7400.3"
      # with the words trimmed. For nightly it is the only number there is.
      - name: Which Firefox
        if: steps.go.outputs.run == 'true'
        id: browser
        env:
          BIN: ${{ steps.install.outputs.firefox-path }}
        run: |
          set -euo pipefail
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          version=$("$BIN" --version 2>&1 | head -1 | sed -E 's/^[^0-9]*//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${version}"

      - name: Run the scenarios
        if: steps.go.outputs.run == 'true'
        id: scenarios
        timeout-minutes: 8
        env:
          FIREFOX: ${{ steps.browser.outputs.bin }}
        run: npm run e2e

      # One small record per leg -- which browser and version this was, how it
      # went, and the scenario results -- so a caller can sum several legs into
      # one table instead of one summary each. Written whatever happened to the
      # scenarios, a skipped docs-only leg included, so the table never has a hole.
      - name: Record the leg
        if: always()
        env:
          LEG: ${{ matrix.channel }}
          NAME: Firefox ${{ matrix.channel }}
          BROWSER: firefox
          VERSION: ${{ steps.browser.outputs.version }}
          OUTCOME: ${{ steps.scenarios.outcome }}
          CODE: ${{ steps.go.outputs.run }}
          REASON: ${{ steps.go.outputs.reason }}
        run: |
          mkdir -p e2e-artifacts
          python3 - <<'PY'
          import json, os
          record = {
              "leg": os.environ["LEG"],
              "name": os.environ["NAME"],
              "browser": os.environ["BROWSER"],
              "version": os.environ["VERSION"],
              # success | failure | cancelled | skipped (docs-only, or never reached)
              "outcome": os.environ["OUTCOME"] or "skipped",
              "skipped": os.environ["REASON"] if os.environ["CODE"] != "true" else "",
              "scenarios": [],
          }
          try:
              with open("e2e-artifacts/results.json", encoding="utf-8") as fh:
                  record["scenarios"] = json.load(fh)["scenarios"]
          except (OSError, ValueError, KeyError):
              pass
          with open("e2e-artifacts/leg.json", "w", encoding="utf-8") as fh:
              json.dump(record, fh, indent=2)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-leg-firefox-${{ matrix.channel }}
          path: e2e-artifacts/leg.json

      - uses: actions/upload-artifact@v7
        id: artifacts
        # always(), so a failed run still uploads its logs -- but not when the
        # scenarios never ran: there is no e2e-artifacts/ on a docs-only change,
        # and starting the upload only to find nothing costs a few seconds of
        # what is otherwise a twenty-second job.
        if: always() && steps.go.outputs.run == 'true'
        with:
          # One name per leg. Two uploads under the same name in one run is an
          # error, and when a version fails you want its artifacts on their own.
          name: e2e-artifacts-firefox-${{ matrix.channel }}
          path: e2e-artifacts/
          if-no-files-found: ignore

      # Reads e2e-artifacts/results.json, which scripts/e2e.mjs writes with one
      # record per scenario. The console output of the run is the same data, but
      # it is 2000 lines down inside a log nobody opens on a green run.
      - name: 📋 Summary
        # A green leg stays quiet when the caller writes the table itself.
        if: always() && (inputs.leg-summary != 'on-failure' || job.status != 'success')
        # Values from expressions go through env: pasted into bash they would
        # run as code, and the changed-paths reason contains a file path.
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          REASON: ${{ steps.go.outputs.reason }}
          WHO: Firefox ${{ matrix.channel }}
          # Empty when nothing was installed, which the heading allows for.
          VERSION: ${{ steps.browser.outputs.version }}
        run: |
          who="${WHO}${VERSION:+ (${VERSION})}"
          case "${{ job.status }}" in
            success)
              if [ "${{ steps.go.outputs.run }}" = "true" ]; then head="### ✅ 🦊 ${who} passed"
              else head="### ⏭️ 🦊 ${who} skipped: ${REASON}"; fi ;;
            cancelled) head="### ⏹️ 🦊 ${who} cancelled (the job timed out, or a newer run took over)" ;;
            *) head="### ❌ 🦊 ${who} failed" ;;
          esac
          {
            echo "$head"
            echo ""
            echo "> ▶️ **Why this ran:** ${EVENT} on \`${REF}\`. Scenarios in \`tests/e2e/scenarios\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.go.outputs.run }}" = "true" ]; then
            python3 scripts/e2e-summary.py e2e-artifacts/results.json >> "$GITHUB_STEP_SUMMARY" || \
              echo "_No scenario results were written; see the job log._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ⏱️ Step times
        # A local action needs the checkout a skipped leg never did.
        if: always() && steps.skip.outputs.skip != 'true' && (inputs.leg-summary != 'on-failure' || job.status != 'success')
        uses: ./.github/actions/step-times
        with:
          token: ${{ github.token }}
          slow-over: 60
          # The same numbers as the steps' timeout-minutes, so a step that hit
          # its limit is named as timed out rather than shown as a bare failure.
          timeouts: "Run ./.github/actions/node-toolcache=4, npm ci=4, Run ./.github/actions/browser-libs=6, Resolve the Firefox version=2, Run browser-actions/setup-firefox@v1=3, Run the scenarios=8"
          job-timeout: 20

  chrome:
    name: Chrome ${{ matrix.channel }}
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    # Only when there is a list to run: an empty matrix is an error, not a no-op.
    # This is the one job-level `if` here, and it is safe because an empty list
    # never comes from a caller whose Chrome legs are required checks. (It
    # does leave one skipped check named with the literal `name` expression,
    # which is why the defaults leave no list empty.)
    #
    # Everything else that skips a leg -- the `ci pause` label, the release PR,
    # and CI's legs when the full run covers them -- is decided by the `skip`
    # step inside the job, never here. A matrix job skipped at the job level is
    # not expanded: it reports once, under the literal text of its `name`
    # expression, and the contexts branch protection is waiting for never
    # arrive, so the PR is stuck. Skipping the steps instead leaves each leg
    # reporting, by name, as a pass -- which is what a skip is meant to be.
    if: inputs.chrome != '[]'
    timeout-minutes: 20
    strategy:
      # Not fail-fast: when one version breaks, the first thing worth knowing is
      # whether the others broke too. Cancelling them throws that away.
      fail-fast: false
      # fromJSON, so a dispatch (whose inputs arrive as strings) gives a number too.
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
      matrix:
        channel: ${{ fromJSON(inputs.chrome) }}
    steps:
      # Whether this leg has anything to do, decided before anything is even
      # checked out. A PR labelled `ci pause` is paused; the release PR only
      # carries the CHANGELOG and the version, which no scenario reads (lint and
      # the unit tests still run on it, which is what keeps `web-ext lint` on
      # the bumped manifest before the tag is cut); and CI's legs on a PR to
      # main carrying `ci run full` are covered by the full run, whose status
      # holds the merge until they pass. Each answer is a pass with a reason.
      - id: skip
        env:
          PAUSED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci pause') }}
          RELEASE: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release-please--') }}
          FULL: ${{ github.event_name == 'pull_request' && inputs.skip-when-full && github.event.pull_request.base.ref == 'main' && contains(github.event.pull_request.labels.*.name, 'ci run full') }}
        run: |
          reason=""
          if [ "$PAUSED" = "true" ]; then reason="the \`ci pause\` label is on this pull request."
          elif [ "$RELEASE" = "true" ]; then reason="the release PR only carries the CHANGELOG and the version, which no scenario reads."
          elif [ "$FULL" = "true" ]; then reason="the \`ci run full\` label is on, so the full run tests this version and more; the \`CI run full\` status holds the merge until it passes."
          fi
          echo "skip=$([ -n "$reason" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          [ -z "$reason" ] || echo "skipping: ${reason}"

      # Full history: the changed-paths action diffs against the base commit.
      - uses: actions/checkout@v7
        if: steps.skip.outputs.skip != 'true'
        with:
          # actions/checkout treats an empty ref as "unset", so the default keeps
          # the behaviour this job had before the input existed.
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Like CI: the job always runs and reports, because it is a required
      # check, but on a docs-only change it skips the work. A browser is not
      # going to notice a README.
      - uses: ./.github/actions/changed-paths
        if: steps.skip.outputs.skip != 'true'
        id: changed

      # The one verdict every step below reads: run, or skip with this reason.
      - id: go
        env:
          SKIP: ${{ steps.skip.outputs.skip }}
          SKIP_REASON: ${{ steps.skip.outputs.reason }}
          CODE: ${{ steps.changed.outputs.code }}
          CODE_REASON: ${{ steps.changed.outputs.reason }}
        run: |
          if [ "$SKIP" = "true" ]; then run=false; reason="$SKIP_REASON"
          elif [ "$CODE" = "true" ]; then run=true; reason="$CODE_REASON"
          else run=false; reason="$CODE_REASON"; fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      # The runner node is short of CPU, not bandwidth: unpacking Node took two
      # minutes and apt nine on a busy day. So the caches hold the unpacked
      # results. Node's tool directory comes back with one zstd untar and
      # setup-node then finds it without downloading or extracting; the browser
      # libraries come back as installed files, skipping dpkg entirely.
      - uses: ./.github/actions/node-toolcache
        if: steps.go.outputs.run == 'true'
        id: node
        timeout-minutes: 4
        with:
          # Every leg of the matrix is the same `github.job`, so without this
          # they would share a key and race to save it on a cold cache.
          key-suffix: "-chrome-${{ matrix.channel }}"
      - name: npm ci
        if: steps.go.outputs.run == 'true'
        id: npm
        timeout-minutes: 4
        run: npm ci --prefer-offline --no-audit --no-fund

      # The system libraries, from the cache when it has them. One list and one
      # cache for both browsers; see the action.
      - uses: ./.github/actions/browser-libs
        if: steps.go.outputs.run == 'true'
        timeout-minutes: 6
        with:
          key: ${{ env.BROWSER_LIBS_KEY }}
          leg: chrome-${{ matrix.channel }}

      # Which Chrome this leg tests, from the Chrome for Testing feed. `stable`
      # is the current stable's exact number; `stable-N` a bare major N behind
      # it, which setup-chrome installs as the latest build of that major.
      # Nightly is Chrome Canary -- and not by channel name: setup-chrome
      # installs a named channel from Google's .deb feeds, which carry no Linux
      # Canary ("Chrome canary not supported for platform linux"). Chrome for
      # Testing does build Canary for Linux, so it is handed today's Canary
      # number and fetches that build instead.
      - name: Resolve the Chrome version
        if: steps.go.outputs.run == 'true'
        id: resolve
        timeout-minutes: 2
        env:
          WANT: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import json, os, re, sys, urllib.request

          want = os.environ["WANT"]
          url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
          with urllib.request.urlopen(url, timeout=30) as r:
              channels = json.load(r)["channels"]
          stable = channels["Stable"]["version"]
          major = int(stable.split(".")[0])
          if want == "stable":
              print(stable)
              sys.exit(0)
          if want == "nightly":
              print(channels["Canary"]["version"])
              sys.exit(0)
          m = re.fullmatch(r"stable-([1-9]\d*)", want)
          if not m:
              sys.exit(f"unknown Chrome channel {want!r}: use nightly, stable or stable-N")
          print(major - int(m.group(1)))
          PY
          )
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${WANT} -> Chrome ${version}"

      - uses: browser-actions/setup-chrome@v1
        if: steps.go.outputs.run == 'true'
        id: install
        timeout-minutes: 3
        with:
          chrome-version: ${{ steps.resolve.outputs.version }}

      # What actually got installed, as the number the table and summary show:
      # "Mozilla Firefox 157.0a1" / "Google Chrome for Testing 154.0.7400.3"
      # with the words trimmed. For nightly it is the only number there is.
      - name: Which Chrome
        if: steps.go.outputs.run == 'true'
        id: browser
        env:
          BIN: ${{ steps.install.outputs.chrome-path }}
        run: |
          set -euo pipefail
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          version=$("$BIN" --version 2>&1 | head -1 | sed -E 's/^[^0-9]*//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${version}"

      - name: Run the scenarios
        if: steps.go.outputs.run == 'true'
        id: scenarios
        timeout-minutes: 8
        env:
          CHROME: ${{ steps.browser.outputs.bin }}
        run: npm run e2e:chrome

      # One small record per leg -- which browser and version this was, how it
      # went, and the scenario results -- so a caller can sum several legs into
      # one table instead of one summary each. Written whatever happened to the
      # scenarios, a skipped docs-only leg included, so the table never has a hole.
      - name: Record the leg
        if: always()
        env:
          LEG: ${{ matrix.channel }}
          NAME: Chrome ${{ matrix.channel }}
          BROWSER: chrome
          VERSION: ${{ steps.browser.outputs.version }}
          OUTCOME: ${{ steps.scenarios.outcome }}
          CODE: ${{ steps.go.outputs.run }}
          REASON: ${{ steps.go.outputs.reason }}
        run: |
          mkdir -p e2e-artifacts
          python3 - <<'PY'
          import json, os
          record = {
              "leg": os.environ["LEG"],
              "name": os.environ["NAME"],
              "browser": os.environ["BROWSER"],
              "version": os.environ["VERSION"],
              # success | failure | cancelled | skipped (docs-only, or never reached)
              "outcome": os.environ["OUTCOME"] or "skipped",
              "skipped": os.environ["REASON"] if os.environ["CODE"] != "true" else "",
              "scenarios": [],
          }
          try:
              with open("e2e-artifacts/results.json", encoding="utf-8") as fh:
                  record["scenarios"] = json.load(fh)["scenarios"]
          except (OSError, ValueError, KeyError):
              pass
          with open("e2e-artifacts/leg.json", "w", encoding="utf-8") as fh:
              json.dump(record, fh, indent=2)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-leg-chrome-${{ matrix.channel }}
          path: e2e-artifacts/leg.json

      - uses: actions/upload-artifact@v7
        id: artifacts
        # always(), so a failed run still uploads its logs -- but not when the
        # scenarios never ran: there is no e2e-artifacts/ on a docs-only change,
        # and starting the upload only to find nothing costs a few seconds of
        # what is otherwise a twenty-second job.
        if: always() && steps.go.outputs.run == 'true'
        with:
          # One name per leg. Two uploads under the same name in one run is an
          # error, and when a version fails you want its artifacts on their own.
          name: e2e-artifacts-chrome-${{ matrix.channel }}
          path: e2e-artifacts/
          if-no-files-found: ignore

      # Reads e2e-artifacts/results.json, which scripts/e2e.mjs writes with one
      # record per scenario. The console output of the run is the same data, but
      # it is 2000 lines down inside a log nobody opens on a green run.
      - name: 📋 Summary
        # A green leg stays quiet when the caller writes the table itself.
        if: always() && (inputs.leg-summary != 'on-failure' || job.status != 'success')
        # Values from expressions go through env: pasted into bash they would
        # run as code, and the changed-paths reason contains a file path.
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          REASON: ${{ steps.go.outputs.reason }}
          WHO: Chrome ${{ matrix.channel }}
          # Empty when nothing was installed, which the heading allows for.
          VERSION: ${{ steps.browser.outputs.version }}
        run: |
          who="${WHO}${VERSION:+ (${VERSION})}"
          case "${{ job.status }}" in
            success)
              if [ "${{ steps.go.outputs.run }}" = "true" ]; then head="### ✅ 🌐 ${who} passed"
              else head="### ⏭️ 🌐 ${who} skipped: ${REASON}"; fi ;;
            cancelled) head="### ⏹️ 🌐 ${who} cancelled (the job timed out, or a newer run took over)" ;;
            *) head="### ❌ 🌐 ${who} failed" ;;
          esac
          {
            echo "$head"
            echo ""
            echo "> ▶️ **Why this ran:** ${EVENT} on \`${REF}\`. Scenarios in \`tests/e2e/scenarios\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.go.outputs.run }}" = "true" ]; then
            python3 scripts/e2e-summary.py e2e-artifacts/results.json >> "$GITHUB_STEP_SUMMARY" || \
              echo "_No scenario results were written; see the job log._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ⏱️ Step times
        # A local action needs the checkout a skipped leg never did.
        if: always() && steps.skip.outputs.skip != 'true' && (inputs.leg-summary != 'on-failure' || job.status != 'success')
        uses: ./.github/actions/step-times
        with:
          token: ${{ github.token }}
          slow-over: 60
          # The same numbers as the steps' timeout-minutes, so a step that hit
          # its limit is named as timed out rather than shown as a bare failure.
          timeouts: "Run ./.github/actions/node-toolcache=4, npm ci=4, Run ./.github/actions/browser-libs=6, Resolve the Chrome version=2, Run browser-actions/setup-chrome@v1=3, Run the scenarios=8"
          job-timeout: 20
