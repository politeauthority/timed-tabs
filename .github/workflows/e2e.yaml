name: E2E
run-name: "E2E — ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

# 🦊 Runs the extension in a real, headless Firefox on the self-hosted runner and
# checks each scenario in tests/e2e/scenarios against the log it produces. See
# docs/developer/e2e.md.
#
# When it runs: every push to main, and every push to an open PR. A PR labelled
# "ci pause" skips the job. The job is a required status check, and GitHub counts a
# skipped required check as passed, so the label lets a PR merge without waiting for
# Firefox while still leaving the check in place for every other PR.
#
# No label events. `on.pull_request.types` cannot filter by label name, so waking on
# `labeled` would start a run for every label -- "needs review", "enhancement",
# anything -- and each one would report `skipped` over whatever this check last said
# about the commit, trading a real pass for a neutral. Applying "ci pause" therefore
# does not retroactively skip a run that already happened; it does not need to,
# because the `Not paused` check goes red the moment the label lands and no paused PR
# can merge anyway. The next push picks the label up.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # the step-times action reads this run's job timings

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (headless Firefox)
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci pause')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Firefox libraries
        # Ubuntu 24.04 on the runner; ALSA is libasound2t64 there.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-0 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6 libpci3 libxtst6 libxrandr2 \
            libxcomposite1 libxdamage1 libgbm1 libnss3 libxss1 bzip2 xz-utils > /dev/null
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - run: '"${{ steps.firefox.outputs.firefox-path }}" --version'

      - name: Run the scenarios
        env:
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        id: artifacts
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore

      # Reads e2e-artifacts/results.json, which scripts/e2e.mjs writes with one
      # record per scenario. The console output of the run is the same data, but
      # it is 2000 lines down inside a log nobody opens on a green run.
      - name: 📋 Summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then head="### ✅ 🦊 E2E passed"; else head="### ❌ 🦊 E2E failed"; fi
          {
            echo "$head"
            echo ""
            echo "> ▶️ **Why this ran:** ${{ github.event_name }} on \`${{ github.ref_name }}\`. Scenarios in \`tests/e2e/scenarios\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python3 scripts/e2e-summary.py e2e-artifacts/results.json >> "$GITHUB_STEP_SUMMARY" || \
            echo "_No scenario results were written; see the job log._" >> "$GITHUB_STEP_SUMMARY"

      - name: ⏱️ Step times
        if: always()
        uses: ./.github/actions/step-times
        with:
          token: ${{ github.token }}
          slow-over: 60
