name: CI
run-name: "CI — ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

# 🧪 Lint, test and build the extension, then run it in a real Firefox, on every PR
# and every push to main. This is the gate that keeps main releasable; the Release
# Please pipeline re-runs it on the tag before it packages, so a green release is
# never assumed from a stale run.
#
# Both halves live here. The E2E half is a reusable workflow rather than a job
# inlined below, because its Firefox plumbing is long enough to bury everything
# else; see e2e.yaml. It reports as `E2E / headless Firefox`, a called workflow's
# checks always being prefixed with the calling job's name.
#
# Runs on the self-hosted `timed-tabs` ARC scale set (defined in private-ops under
# arc/runners/values-timed-tabs.yaml); setup-node installs the Node it needs. `npm run
# lint` covers both eslint and `web-ext lint`, so manifest/WebExtension problems are
# caught here rather than at AMO submission time.
#
# The pipeline as a whole is written up in docs/developer/ci/, and the runner and its
# caches in docs/developer/ci/runners.md.

on:
  pull_request:
    # No label events here on purpose. Pausing is enforced by the `Not paused`
    # check, which is cheap enough to be woken by every label; waking this job
    # instead would make arming auto-merge cost a full build.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # the step-times action reads this run's job timings

# Cancel superseded runs on a PR, never on main. A PR's older run is answering a
# question about a commit nobody will merge any more, so killing it is free. On
# main it is the only run that commit will ever get: branch protection does not
# require branches to be up to date (`strict: false`), so the merge-ref result
# from the PR does not cover what actually landed.
#
# So main runs share no group at all: each push gets a group of its own, keyed
# on the run id. Sharing one with cancel-in-progress off was not enough --
# GitHub keeps a single *pending* run per group and cancels the older pending
# one when a third arrives, so four PRs merged in three minutes left two of
# their commits never tested on main, one cancelled and one that never started.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: Lint, test & build
    timeout-minutes: 15
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    steps:
      # Full history: the changed-paths action diffs against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This job always runs and always reports. It is a required check, so a
      # `paths:` filter on the trigger would leave it pending for ever on a
      # docs-only PR and nothing would be mergeable. Skipping the work while
      # still answering is the part that is safe.
      - uses: ./.github/actions/changed-paths
        id: changed

      - uses: ./.github/actions/node-toolcache
        if: steps.changed.outputs.code == 'true'
      # Same flags as every other npm ci in this repo. setup-node has already
      # restored ~/.npm, so --prefer-offline takes packages from it instead of
      # revalidating each one against the registry, and the audit and funding
      # round trips buy nothing in CI. Measured on one run, against the two E2E
      # legs installing the same lockfile beside it: 27s here, 16s there.
      - if: steps.changed.outputs.code == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint
        id: lint
        if: steps.changed.outputs.code == 'true'
        run: npm run lint
      - name: Test
        id: test
        if: steps.changed.outputs.code == 'true'
        run: npm test
      - name: Build (firefox + chrome)
        id: build
        if: steps.changed.outputs.code == 'true'
        run: npm run build
      - uses: ./.github/actions/step-times
        if: always()
        with:
          token: ${{ github.token }}

      - name: 📋 Summary
        # The paused step wrote its own summary; a "failed" block under it would
        # only muddy what is a deliberate red.
        if: always()
        # Values from expressions go through env: pasted into bash they would run
        # as code, and the changed-paths reason contains a file path. e2e.yaml got
        # these when the summaries were fixed; this one was left reading three
        # unset variables, so every line below rendered blank.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          REASON: ${{ steps.changed.outputs.reason }}
        run: |
          if [ "${{ steps.changed.outputs.code }}" != "true" ]; then
            {
              echo "### ⏭️ 🧪 Lint, test & build skipped"
              echo ""
              echo "> ▶️ **Why this ran:** ${EVENT} on \`${REF}\`."
              echo ""
              echo "${REASON} Nothing here can change what lint, the tests or the build would say, so they did not run."
              echo ""
              echo "The job still reports, because it is a required check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then head="### ✅ 🧪 Lint, test & build passed"; else head="### ❌ 🧪 Lint, test & build failed"; fi
          {
            echo "$head"
            echo ""
            echo "> ▶️ **Why this ran:** ${EVENT} on \`${REF}\`."
            echo ""
            echo "${REASON}"
            echo ""
            echo "🔬 \`npm run lint\`: \`${{ steps.lint.outcome }}\` · 🧪 \`npm test\`: \`${{ steps.test.outcome }}\` · 🏗️ \`npm run build\`: \`${{ steps.build.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 🦊 The extension in a real, headless Firefox. Gated on the job above: Firefox
  # takes minutes to install and there is no sense spending them on a branch that
  # does not lint. A failure up there skips this check rather than reddening it,
  # which branch protection reads as a pass -- but `Lint, test & build` is required
  # too and is the one that went red, so nothing merges on the back of the skip.
  e2e:
    name: E2E
    needs: lint-test
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read
      actions: read
    with:
      # The two Firefoxes are required checks; Chrome stable reports beside them
      # and is advisory until branch protection says otherwise.
      firefox: '["stable", "previous"]'
      chrome: '["stable"]'
      # A PR to main carrying `ci run full` runs these same versions inside the
      # full run, and the `CI run full` status holds the merge until they pass.
      # So the legs skip here rather than run twice; a skipped required check
      # reads as a pass, and the status is the thing actually holding the door.
      skip-when-full: true
