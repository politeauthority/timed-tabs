name: CI
run-name: "CI — ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

# 🧪 Lint, test and build the extension on every PR and every push to main. This is
# the gate that keeps main releasable; the Release Please pipeline re-runs it on the
# tag before it packages, so a green release is never assumed from a stale run.
#
# Runs on the self-hosted `timed-tabs` ARC scale set (defined in private-ops under
# arc/runners/values-timed-tabs.yaml); setup-node installs the Node it needs. `npm run
# lint` covers both eslint and `web-ext lint`, so manifest/WebExtension problems are
# caught here rather than at AMO submission time.

on:
  pull_request:
    # No label events here on purpose. Pausing is enforced by the `Not paused`
    # check, which is cheap enough to be woken by every label; waking this job
    # instead would make arming auto-merge cost a full build.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # the step-times action reads this run's job timings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint, test & build
    timeout-minutes: 15
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    steps:
      # Full history: the changed-paths action diffs against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This job always runs and always reports. It is a required check, so a
      # `paths:` filter on the trigger would leave it pending for ever on a
      # docs-only PR and nothing would be mergeable. Skipping the work while
      # still answering is the part that is safe.
      - uses: ./.github/actions/changed-paths
        id: changed

      - uses: ./.github/actions/node-toolcache
        if: steps.changed.outputs.code == 'true'
      - if: steps.changed.outputs.code == 'true'
        run: npm ci
      - name: Lint
        id: lint
        if: steps.changed.outputs.code == 'true'
        run: npm run lint
      - name: Test
        id: test
        if: steps.changed.outputs.code == 'true'
        run: npm test
      - name: Build (firefox + chrome)
        id: build
        if: steps.changed.outputs.code == 'true'
        run: npm run build
      - uses: ./.github/actions/step-times
        if: always()
        with:
          token: ${{ github.token }}

      - name: 📋 Summary
        # The paused step wrote its own summary; a "failed" block under it would
        # only muddy what is a deliberate red.
        if: always()
        run: |
          if [ "${{ steps.changed.outputs.code }}" != "true" ]; then
            {
              echo "### ⏭️ 🧪 Lint, test & build skipped"
              echo ""
              echo "> ▶️ **Why this ran:** ${EVENT} on \`${REF}\`."
              echo ""
              echo "${REASON} Nothing here can change what lint, the tests or the build would say, so they did not run."
              echo ""
              echo "The job still reports, because it is a required check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then head="### ✅ 🧪 Lint, test & build passed"; else head="### ❌ 🧪 Lint, test & build failed"; fi
          {
            echo "$head"
            echo ""
            echo "> ▶️ **Why this ran:** ${EVENT} on \`${REF}\`."
            echo ""
            echo "${REASON}"
            echo ""
            echo "🔬 \`npm run lint\`: \`${{ steps.lint.outcome }}\` · 🧪 \`npm test\`: \`${{ steps.test.outcome }}\` · 🏗️ \`npm run build\`: \`${{ steps.build.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
