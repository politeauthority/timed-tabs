name: CI run full
run-name: "CI run full — PR #${{ github.event.pull_request.number }}"

# 🏷️ The `ci run full` label: required to merge into main, and while it is on,
# the E2E scenarios run on nightly, stable and the two stables before it in
# Firefox, and on nightly and stable in Chrome, instead of CI's five legs. Each
# browser is its own
# segment of the table with its own verdict. Nightly is advisory in both -- a
# daily build breaking is worth seeing and not worth holding a merge for -- and
# so is every Chrome leg while Chrome is planned rather than supported: the
# status is set by the Firefox stable legs alone.
#
# GitHub has no such thing as a required label, so the label is enforced by a
# required status named `CI run full` that reads it. The gate job at the bottom
# posts that status on the head commit -- it is a commit status, not the job's
# own check, and the difference is the whole point. A missing label is not a
# failure, it is a merge requirement not yet met, so the gate reports it as
# *pending*: the merge box says "Waiting" and stays locked, and nothing on the
# PR is red for a label nobody has had a reason to add yet. The status goes
# green once the label is on and every leg has passed, back to pending
# the moment the label comes off, and to failure only when the Firefoxes fail.
# Auto-merge adds the label when it arms (see automerge.yaml), so a PR marked to
# merge itself gets the full run without anyone remembering.
#
# Three jobs:
#   - plan     decides what this event needs, on a hosted runner in seconds
#   - Full     the six legs, e2e.yaml called with a longer `legs` list, so
#              they report as `Full / Firefox nightly` ... `Full / Chrome stable`
#   - Full run gate   posts the `CI run full` status, which is the only thing
#              branch protection reads. Its own check is not required and is
#              named differently on purpose, so the two cannot be confused.
#
# It wakes on every label event, and it must: the gate is a required check, so
# it can never filter itself down to its own label -- a skipped required check
# is a pass, and on an unlabelled PR that would hand back the merge the label
# is holding. What keeps that cheap is `plan`. Eight browsers only run when the
# head commit has not already passed them: a later event on a commit an earlier
# run has finished green finds that run and reuses it. A run on a commit the PR
# has since moved past is cancelled by the concurrency group below.
#
# Only merges into main need the label. A PR against any other branch, and the
# release PR (whose branch never carries anything a scenario can read; see
# e2e.yaml), pass the gate without it.
#
# ⚠️ PREREQ: `CI run full` must be a required status on main, or pending holds
# nothing. It is set by the API rather than by a job, so its entry in branch
# protection carries `app_id: -1` (any source) rather than the Actions app id
# the job-backed checks use. Add it only once this file is on main -- a required
# status nothing ever posts blocks every PR for ever. The canonical list is the
# `gh api` call in docs/developer/ci/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  actions: read

# One group per pull request, and the newest event takes it: a push cancels
# whatever was still running for the commit before it. The commit used to be in
# the group key, which put every commit in a group of its own and so left a run
# on a commit the PR had moved past with nothing able to cancel it -- `plan` had
# to do it over the API instead, and `plan` needs a runner first. On a queue
# deep enough to matter that is exactly the runner it does not get, so the
# stale run sat in front of the live one it was supposed to make way for.
# Concurrency is applied when the run is queued and costs no runner at all,
# which is why it belongs here and not in a job.
#
# The cost is the one case the commit in the key used to buy: a label added
# while the legs for that same commit are already running now cancels and
# restarts them, where before it queued behind and reused the result. A label
# burst still collapses -- GitHub keeps one pending run per group and cancels
# the rest either way -- and `plan` still reuses a run that has *finished*
# green on the commit, which is the path auto-merge arming takes.
concurrency:
  group: full-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan the full run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read       # to find an earlier run on this commit worth reusing
      contents: read
    outputs:
      # exempt | paused | missing | reuse | run
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      # The run whose leg records the gate should read: this one, or the
      # earlier one whose result is being reused.
      run: ${{ steps.plan.outputs.run }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          # A run's `name` in the API is its run-name ("CI run full — PR #7"),
          # so runs of this workflow are picked out by file instead.
          WORKFLOW: .github/workflows/full.yaml
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci run full') }}
          PAUSED: ${{ contains(github.event.pull_request.labels.*.name, 'ci pause') }}
        run: |
          set -euo pipefail
          decide() {
            echo "mode=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "$1: $2"
          }

          # Nothing to cancel here any more: the concurrency group at the top
          # of this file drops a run on a commit the PR has moved past, and it
          # does it without waiting for a runner, which this job cannot.

          if [ "$BASE" != "main" ]; then
            decide exempt "the label is only required to merge into main, and this PR targets \`${BASE}\`"; exit 0
          fi
          case "$HEAD_REF" in release-please--*)
            decide exempt "the release PR only carries the CHANGELOG and the version, which no scenario reads"; exit 0 ;;
          esac
          if [ "$PAUSED" = "true" ]; then
            decide paused "the \`ci pause\` label is on, so nothing runs"; exit 0
          fi
          if [ "$LABELLED" != "true" ]; then
            decide missing "the \`ci run full\` label is not on this pull request"; exit 0
          fi

          # The same commit already passed the full run: a label or review
          # event since then changes nothing a browser would notice.
          # An earlier run counts only if its legs ran and every one
          # passed. The run's own conclusion is not enough: the gate exits 0
          # when the label is merely missing, so an unlabelled run concludes
          # "success" having tested nothing, and trusting that would let a
          # later `labeled` event wave the commit through untested.
          earlier=""
          for id in $(gh api "repos/${GH_REPO}/actions/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100" \
                        --jq ".workflow_runs[] | select(.path == \"${WORKFLOW}\" and .id != ${RUN_ID}) | .id"); do
            if gh api "repos/${GH_REPO}/actions/runs/${id}/jobs?per_page=100" \
                 --jq '[.jobs[] | select(.name | startswith("Full / "))] | length > 0 and all(.conclusion == "success")' | grep -qx true; then
              earlier="$id"; break
            fi
          done
          if [ -n "$earlier" ]; then
            echo "run=${earlier}" >> "$GITHUB_OUTPUT"
            decide reuse "run ${earlier} already passed every leg on ${HEAD_SHA:0:7}"; exit 0
          fi
          echo "run=${RUN_ID}" >> "$GITHUB_OUTPUT"
          decide run "the label is on and ${HEAD_SHA:0:7} has not been through the legs yet"

  # Eight legs: the current release and the three majors before it, in Firefox
  # and in Chrome. Each reports as `Full / <Browser> <leg>`; none is required on its own, the gate
  # below is. e2e.yaml resolves each leg to an exact version at run time.
  firefox:
    name: Full
    needs: plan
    if: needs.plan.outputs.mode == 'run'
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read
      actions: read
    with:
      # The standard set, in both browsers: the daily build, the current stable
      # and the two stables before it. None of the legs is required on its own;
      # the status the gate posts is, and it ignores nightly.
      firefox: '["nightly", "stable", "stable-1", "stable-2"]'
      # Only nightly and stable while Chrome is planned rather than supported
      # (docs/road-map.md), and both advisory; the older majors join when it is.
      chrome: '["nightly", "stable"]'
      # Not all at once: ten at a time starved one another on the runner node
      # until three legs saw one tick in their whole window and failed on
      # timing alone. Two per browser, so four at a time across the two jobs,
      # is two waves of about four minutes.
      max-parallel: 2
      # The gate below writes one table for all eight; a green leg's own summary
      # would only repeat its row. A failed leg still writes its own.
      leg-summary: on-failure

  gate:
    name: Full run gate
    needs: [plan, firefox]
    # always(): `firefox` is skipped on every path but `run`, and a job that
    # needs a skipped job is itself skipped unless told otherwise -- and a
    # skipped gate posts no status at all, which leaves the merge box waiting
    # for one that never comes.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write     # the `CI run full` status on the head commit
    steps:
      # Only the two scripts the summary needs; the gate is not a build.
      - uses: actions/checkout@v7
        if: needs.plan.outputs.mode == 'run' || needs.plan.outputs.mode == 'reuse'
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      # Every leg's record, from this run or the one being reused.
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.mode == 'run' || needs.plan.outputs.mode == 'reuse'
        with:
          pattern: e2e-leg-*
          path: legs
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ github.token }}
      # The table, and the verdict: the script exits 0 when every leg that
      # counts passed, 3 when one failed, and nightly legs do not count -- so
      # the `Full` job's own result (which nightly does drag down) is not what
      # the status is set from.
      - name: Table of the legs
        if: needs.plan.outputs.mode == 'run' || needs.plan.outputs.mode == 'reuse'
        id: table
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ needs.plan.outputs.run }}
        run: |
          # +e explicitly: GitHub runs this under `bash -e`, and the script's
          # exit 3 (a leg that counts failed) must reach the case below, not
          # abort the step -- which left the status unposted and the PR
          # pending rather than red the first time a leg failed.
          set -u +e -o pipefail
          gh run view "$RUN" --json jobs > jobs.json || echo '{"jobs": []}' > jobs.json
          # stdout is the table; stderr is one line per browser, "Firefox: passed"
          # or "Chrome: stable failed", which becomes the status description.
          # What counts towards the status: nightly never does, and no Chrome
          # leg does while Chrome is advisory. Keep in step with e2e.yaml's
          # `chrome-advisory` default.
          python3 scripts/e2e-full-summary.py --advisory nightly,chrome legs jobs.json > table.md 2> verdict.txt
          case $? in
            0) verdict=pass ;;
            3) verdict=fail ;;
            *) verdict=error; echo "_The leg table could not be built; see the browser jobs on this run._" > table.md; cat verdict.txt ;;
          esac
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "segments=$(paste -sd ';' verdict.txt | sed 's/;/; /g')" >> "$GITHUB_OUTPUT"
          echo "verdict: ${verdict} ($(paste -sd ';' verdict.txt))"
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ needs.plan.outputs.mode }}
          REASON: ${{ needs.plan.outputs.reason }}
          PLAN: ${{ needs.plan.result }}
          FIREFOX: ${{ needs.firefox.result }}
          VERDICT: ${{ steps.table.outputs.verdict }}
          SEGMENTS: ${{ steps.table.outputs.segments }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The status is what branch protection reads. `pending` blocks the
          # merge without painting anything red; the description is what the
          # merge box shows beside it, and GitHub cuts it at 140 characters.
          status() {   # <state> <description>
            gh api -X POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context="CI run full" -f target_url="$RUN_URL" \
              -f description="$(printf '%s' "$2" | cut -c1-140)" > /dev/null
            echo "CI run full -> $1: $2"
          }
          report() {   # <emoji> <verdict> <detail...>
            local emoji="$1" verdict="$2"; shift 2
            {
              echo "### ${emoji} CI run full: ${verdict}"
              echo ""
              echo "> ▶️ **Why this ran:** \`${ACTION}\` on #${PR}."
              echo ""
              printf '%s\n' "$@"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$PLAN" != "success" ]; then
            status error "The plan job ended ${PLAN}; see the run."
            report ❌ "could not plan" "The plan job ended \`${PLAN}\`; see its log."; exit 1
          fi
          case "$MODE" in
            exempt)
              status success "Not needed: ${REASON}"
              report ✅ "not needed" "Passed without the label: ${REASON}." ;;
            paused)
              # Not a failure of anything; `Not paused` is the check holding the
              # red for the pause label. This one just waits.
              status pending "Paused: ${REASON}"
              report ⏸️ "paused" "Waiting: ${REASON}. Remove \`ci pause\` and push, or re-add \`ci run full\`, to run it." ;;
            missing)
              status pending "Add the 'ci run full' label to merge into main; arming auto-merge adds it for you"
              report 🏷️ "waiting for the label" \
                "The merge is held, not failed: ${REASON}." "" \
                "Merging into \`main\` needs the E2E scenarios to pass on stable and the two stables before it, in Firefox and Chrome." \
                "Add the **\`ci run full\`** label to run them; arming auto-merge adds it for you." ;;
            reuse)
              status success "Passed on this commit already: ${REASON}"
              report ✅ "passed" "Reused an earlier result: ${REASON}." "" "$(cat table.md)" ;;
            run)
              # The verdict comes from the leg records, not from the `Full` job:
              # a nightly leg failing turns that job red and changes nothing here.
              if [ "$FIREFOX" = "cancelled" ]; then
                status error "The legs were cancelled; re-run or push again"
                report ⏹️ "cancelled" "The legs were cancelled: a job timed out, or a newer commit took over." "" "$(cat table.md)"; exit 1
              fi
              case "$VERDICT" in
                pass)
                  status success "${SEGMENTS:-Every leg that counts passed}"
                  report ✅ "passed" "$(cat table.md)" ;;
                fail)
                  status failure "${SEGMENTS:-A leg that counts failed; nightly does not count}"
                  report ❌ "failed" "$(cat table.md)"; exit 1 ;;
                *)
                  status error "The leg records could not be read; see the run"
                  report ❌ "no verdict" "$(cat table.md)"; exit 1 ;;
              esac ;;
            *)
              status error "Plan mode '${MODE}' is not one the gate knows"
              report ❌ "unknown plan" "Plan mode \`${MODE}\` is not one this gate knows."; exit 1 ;;
          esac
