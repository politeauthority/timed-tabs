name: CI run full
run-name: "CI run full — PR #${{ github.event.pull_request.number }}"

# 🏷️ The `ci run full` label: required to merge into main, and while it is on,
# the E2E scenarios run on the last four Firefox releases instead of two.
#
# GitHub has no such thing as a required label, so the label is enforced by a
# required status named `CI run full` that reads it. The gate job at the bottom
# posts that status on the head commit -- it is a commit status, not the job's
# own check, and the difference is the whole point. A missing label is not a
# failure, it is a merge requirement not yet met, so the gate reports it as
# *pending*: the merge box says "Waiting" and stays locked, and nothing on the
# PR is red for a label nobody has had a reason to add yet. The status goes
# green once the label is on and the four Firefoxes have passed, back to pending
# the moment the label comes off, and to failure only when the Firefoxes fail.
# Auto-merge adds the label when it arms (see automerge.yaml), so a PR marked to
# merge itself gets the full run without anyone remembering.
#
# Three jobs:
#   - plan     decides what this event needs, on a hosted runner in seconds
#   - Full     the four legs, e2e.yaml called with a longer `firefox` list, so
#              they report as `Full / Firefox latest` ... `Full / Firefox previous-3`
#   - Full run gate   posts the `CI run full` status, which is the only thing
#              branch protection reads. Its own check is not required and is
#              named differently on purpose, so the two cannot be confused.
#
# It wakes on every label event, and it must: the gate is a required check, so
# it can never filter itself down to its own label -- a skipped required check
# is a pass, and on an unlabelled PR that would hand back the merge the label
# is holding. What keeps that cheap is `plan`. Four Firefoxes only run when the
# head commit has not already passed them: any later event on the same commit
# (another label, a review) finds the earlier green run and reuses it, and
# events on an older commit are cancelled outright.
#
# Only merges into main need the label. A PR against any other branch, and the
# release PR (whose branch never carries anything a scenario can read; see
# e2e.yaml), pass the gate without it.
#
# ⚠️ PREREQ: `CI run full` must be a required status on main, or pending holds
# nothing. It is set by the API rather than by a job, so its entry in branch
# protection carries `app_id: -1` (any source) rather than the Actions app id
# the job-backed checks use. Add it only once this file is on main -- a required
# status nothing ever posts blocks every PR for ever. The canonical list is the
# `gh api` call in docs/developer/ci/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  actions: read

# One group per head commit, and nothing is cancelled: a second event on the
# same commit waits behind the run already testing it, then finds it green and
# reuses it (see `plan`). Runs on a commit the PR has moved past are cancelled
# by `plan` instead, since a group keyed on the commit cannot see them.
concurrency:
  group: full-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the full run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write      # to cancel runs on commits this PR has moved past
      contents: read
    outputs:
      # exempt | paused | missing | reuse | run
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      # The run whose leg records the gate should read: this one, or the
      # earlier one whose result is being reused.
      run: ${{ steps.plan.outputs.run }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          # A run's `name` in the API is its run-name ("CI run full — PR #7"),
          # so runs of this workflow are picked out by file instead.
          WORKFLOW: .github/workflows/full.yaml
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci run full') }}
          PAUSED: ${{ contains(github.event.pull_request.labels.*.name, 'ci pause') }}
        run: |
          set -euo pipefail
          decide() {
            echo "mode=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "$1: $2"
          }

          # Older commits of this PR still running the four legs are answering a
          # question nobody will merge any more. Older only: two pushes in
          # quick succession start two runs, and the first one's plan must not
          # cancel the newer one that is about to cancel it.
          for status in queued in_progress; do
            gh api "repos/${GH_REPO}/actions/runs?event=pull_request&status=${status}&branch=${HEAD_REF}&per_page=100" \
              --jq ".workflow_runs[] | select(.path == \"${WORKFLOW}\" and .head_sha != \"${HEAD_SHA}\" and .run_number < ${RUN_NUMBER}) | .id" \
              | while read -r id; do
                  echo "cancelling run ${id}: an older commit of this PR"
                  gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/cancel" > /dev/null || true
                done
          done

          if [ "$BASE" != "main" ]; then
            decide exempt "the label is only required to merge into main, and this PR targets \`${BASE}\`"; exit 0
          fi
          case "$HEAD_REF" in release-please--*)
            decide exempt "the release PR only carries the CHANGELOG and the version, which no scenario reads"; exit 0 ;;
          esac
          if [ "$PAUSED" = "true" ]; then
            decide paused "the \`ci pause\` label is on, so nothing runs"; exit 0
          fi
          if [ "$LABELLED" != "true" ]; then
            decide missing "the \`ci run full\` label is not on this pull request"; exit 0
          fi

          # The same commit already passed the full run: a label or review
          # event since then changes nothing Firefox would notice.
          # An earlier run counts only if its Firefox legs ran and every one
          # passed. The run's own conclusion is not enough: the gate exits 0
          # when the label is merely missing, so an unlabelled run concludes
          # "success" having tested nothing, and trusting that would let a
          # later `labeled` event wave the commit through untested.
          earlier=""
          for id in $(gh api "repos/${GH_REPO}/actions/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100" \
                        --jq ".workflow_runs[] | select(.path == \"${WORKFLOW}\" and .id != ${RUN_ID}) | .id"); do
            if gh api "repos/${GH_REPO}/actions/runs/${id}/jobs?per_page=100" \
                 --jq '[.jobs[] | select(.name | startswith("Full / "))] | length > 0 and all(.conclusion == "success")' | grep -qx true; then
              earlier="$id"; break
            fi
          done
          if [ -n "$earlier" ]; then
            echo "run=${earlier}" >> "$GITHUB_OUTPUT"
            decide reuse "run ${earlier} already passed the four Firefoxes on ${HEAD_SHA:0:7}"; exit 0
          fi
          echo "run=${RUN_ID}" >> "$GITHUB_OUTPUT"
          decide run "the label is on and ${HEAD_SHA:0:7} has not been through the four Firefoxes yet"

  # Four legs: the current release and the three majors before it. Each reports
  # as `Full / Firefox <leg>`; none of them is required on its own, the gate
  # below is. e2e.yaml resolves each leg to an exact version at run time.
  firefox:
    name: Full
    needs: plan
    if: needs.plan.outputs.mode == 'run'
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read
      actions: read
    with:
      firefox: '["latest", "previous", "previous-2", "previous-3"]'
      # The same four majors back for Chrome, on the one branch proving Chrome
      # on this runner; everywhere else an empty list, and the full run is the
      # four Firefoxes it always was. None of the Chrome legs is required.
      chrome: ${{ (github.event.pull_request.head.ref == 'feat/chrome-e2e') && '["stable", "previous", "previous-2", "previous-3"]' || '[]' }}
      # Not all at once: ten at a time starved one another on the runner node
      # until three legs saw one tick in their whole window and failed on
      # timing alone. Two at a time is two waves of about four minutes.
      max-parallel: 2
      # The gate below writes one table for all four; a green leg's own summary
      # would only repeat its row. A failed leg still writes its own.
      leg-summary: on-failure

  gate:
    name: Full run gate
    needs: [plan, firefox]
    # always(): `firefox` is skipped on every path but `run`, and a job that
    # needs a skipped job is itself skipped unless told otherwise -- and a
    # skipped gate posts no status at all, which leaves the merge box waiting
    # for one that never comes.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write     # the `CI run full` status on the head commit
    steps:
      # Only the two scripts the summary needs; the gate is not a build.
      - uses: actions/checkout@v7
        if: needs.plan.outputs.mode == 'run' || needs.plan.outputs.mode == 'reuse'
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      # Every leg's record, from this run or the one being reused.
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.mode == 'run' || needs.plan.outputs.mode == 'reuse'
        with:
          pattern: e2e-leg-*
          path: legs
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ github.token }}
      - name: Table of the legs
        if: needs.plan.outputs.mode == 'run' || needs.plan.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ needs.plan.outputs.run }}
        run: |
          set -euo pipefail
          gh run view "$RUN" --json jobs > jobs.json || echo '{"jobs": []}' > jobs.json
          python3 scripts/e2e-full-summary.py legs jobs.json > table.md \
            || echo "_The leg table could not be built; see the Firefox jobs on this run._" > table.md
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ needs.plan.outputs.mode }}
          REASON: ${{ needs.plan.outputs.reason }}
          PLAN: ${{ needs.plan.result }}
          FIREFOX: ${{ needs.firefox.result }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The status is what branch protection reads. `pending` blocks the
          # merge without painting anything red; the description is what the
          # merge box shows beside it, and GitHub cuts it at 140 characters.
          status() {   # <state> <description>
            gh api -X POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context="CI run full" -f target_url="$RUN_URL" \
              -f description="$(printf '%s' "$2" | cut -c1-140)" > /dev/null
            echo "CI run full -> $1: $2"
          }
          report() {   # <emoji> <verdict> <detail...>
            local emoji="$1" verdict="$2"; shift 2
            {
              echo "### ${emoji} CI run full: ${verdict}"
              echo ""
              echo "> ▶️ **Why this ran:** \`${ACTION}\` on #${PR}."
              echo ""
              printf '%s\n' "$@"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$PLAN" != "success" ]; then
            status error "The plan job ended ${PLAN}; see the run."
            report ❌ "could not plan" "The plan job ended \`${PLAN}\`; see its log."; exit 1
          fi
          case "$MODE" in
            exempt)
              status success "Not needed: ${REASON}"
              report ✅ "not needed" "Passed without the label: ${REASON}." ;;
            paused)
              # Not a failure of anything; `Not paused` is the check holding the
              # red for the pause label. This one just waits.
              status pending "Paused: ${REASON}"
              report ⏸️ "paused" "Waiting: ${REASON}. Remove \`ci pause\` and push, or re-add \`ci run full\`, to run it." ;;
            missing)
              status pending "Add the 'ci run full' label to merge into main; arming auto-merge adds it for you"
              report 🏷️ "waiting for the label" \
                "The merge is held, not failed: ${REASON}." "" \
                "Merging into \`main\` needs the E2E scenarios to pass on the last four Firefox releases." \
                "Add the **\`ci run full\`** label to run them; arming auto-merge adds it for you." ;;
            reuse)
              status success "Passed on this commit already: ${REASON}"
              report ✅ "passed" "Reused an earlier result: ${REASON}." "" "$(cat table.md)" ;;
            run)
              case "$FIREFOX" in
                success)
                  status success "All four Firefox legs passed"
                  report ✅ "passed" "$(cat table.md)" ;;
                cancelled)
                  status error "The Firefox legs were cancelled; re-run or push again"
                  report ⏹️ "cancelled" "The Firefox legs were cancelled: a job timed out, or a newer commit took over." "" "$(cat table.md)"; exit 1 ;;
                *)
                  status failure "At least one of the four Firefox legs failed"
                  report ❌ "failed" "$(cat table.md)"; exit 1 ;;
              esac ;;
            *)
              status error "Plan mode '${MODE}' is not one the gate knows"
              report ❌ "unknown plan" "Plan mode \`${MODE}\` is not one this gate knows."; exit 1 ;;
          esac
