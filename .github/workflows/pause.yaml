name: Not paused
run-name: "Not paused — PR #${{ github.event.pull_request.number }}"

# ⏸️ The `ci pause` label, enforced on its own.
#
# This is deliberately a separate check from CI. Pausing has to take effect the
# moment the label goes on, which means listening to `labeled`; if the heavy CI
# job did that, every label change -- including the `automerge` one -- would
# start a fresh build and the PR would wait a full cycle for it. This job runs
# on a hosted runner in seconds, so it can afford to be woken by any label.
#
# It is the one label listener that must not filter itself down to `ci pause`.
# The trigger cannot match on a label name, so a filter would have to be an `if`
# on the job, and this job's whole value is the red it reports: skip it for an
# unrelated label on a paused PR and the red turns into a neutral that branch
# protection accepts, unblocking the merge the label was holding. Running and
# passing in three seconds costs less than that hole.
#
# It fails while the label is on, and that is the point: a required job that is
# *skipped* counts as passed, so a paused check reporting green would quietly
# remove the gate the label exists to hold. Red with an explanation is honest --
# CI has not verified this, and it must not merge.
#
# ⚠️ PREREQ: `Not paused` has to be a required check on main, or a red one
# blocks nothing. Add it only once this file is on main: a required check whose
# workflow is missing never reports, and that blocks every PR for ever.
#
# It is required now. It was not for a while, and the gap is worth remembering:
# the job ran on every PR, went red on every paused one, and merged none of them
# any slower, because branch protection was not reading it. A check nobody
# requires is decoration. The canonical list of required contexts is the
# `gh api` call in docs/developer/ci/README.md -- add to that list and to the
# branch in the same change.

# It is also where the release gate gets woken. Release Please used to listen to
# label and review events itself, which put five skipped jobs on every pull
# request each time; now this job, already awake for every label, dispatches it
# only when the event is one that could clear the gate.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: write        # to dispatch Release Please when the gate is cleared

jobs:
  paused:
    name: Not paused
    runs-on: ubuntu-latest
    steps:
      - name: Check the label
        env:
          PAUSED: ${{ contains(github.event.pull_request.labels.*.name, 'ci pause') }}
        run: |
          set -euo pipefail
          if [ "$PAUSED" != "true" ]; then
            {
              echo "### ▶️ Not paused"
              echo ""
              echo "No \`ci pause\` label, so the checks run as usual."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### ⏸️ CI is paused for this pull request"
            echo ""
            echo "> ▶️ **Why this ran:** the \`ci pause\` label is on this pull request."
            echo ""
            echo "Lint, the tests and the build were not run against this commit."
            echo ""
            echo "This check is red on purpose. It is required, and a paused check that"
            echo "reported green would let the branch merge unverified. Remove the label"
            echo "and everything runs again."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Wake the release gate
        # Only for the release PR, and only for the two things that clear its gate.
        if: >-
          startsWith(github.event.pull_request.head.ref, 'release-please--')
          && (
            (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'release-approved')
            || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
          )
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WHY: ${{ github.event_name == 'pull_request_review' && 'an approving review' || 'the release-approved label' }}
        run: |
          set -euo pipefail
          gh workflow run release-please.yaml --ref main
          {
            echo "### 🔓 Release gate"
            echo ""
            echo "${WHY} landed on the release PR, so **Release Please** was dispatched to check the gate."
          } >> "$GITHUB_STEP_SUMMARY"
