name: Beta Release
run-name: "Beta Release — ${{ github.ref_name }}"

# Cuts a beta from `main` as it stands right now. A beta is a snapshot of the
# work the pending release PR would ship, so it is named after that PR's
# version: "chore(main): release 0.8.0" gives v0.8.0-beta.N, where N counts the
# commits on main since the last stable tag. Nothing is bumped or committed;
# release-please is untouched and the stable pipeline stays exactly as it is.
#
# Firefox only accepts digits in the manifest version, so the beta ships with
# MANIFEST_VERSION=<last stable>.N (0.7.0.14). That sorts after 0.7.0 and before
# 0.8.0, so a beta install updates cleanly to the next stable once builds are
# signed. The UI shows 0.8.0-beta.14 and a BETA badge; see
# docs/developer/ci/releasing.md.
#
# Refuses to run when there is no open release PR (nothing releasable on main)
# or when the beta tag for the current commit already exists.
#
# Three jobs, in order. `version` resolves the tag and pins the commit, failing
# fast on every mistake git and the PR list can see. `e2e` runs the scenario
# suite in both Firefoxes against that commit. Only then does `beta` lint, test,
# build and publish it.
#
# The E2E leg is a gate, not new coverage. Every commit on `main` already ran the
# scenarios on the push that landed it, so a green beta is usually re-proving
# what CI proved minutes earlier. What it buys is that the proof is about *this*
# commit: a dispatch does not look at whether main's own run passed, is still
# going, or went red, and without this a beta could be cut from a red main and
# handed to someone to install. Re-running costs about eight minutes of Firefox;
# checking main's existing conclusion instead would be cheaper and weaker.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # the step-times action reads this run's job timings
  pull-requests: read

concurrency:
  group: release-please-main   # never race a stable release
  cancel-in-progress: false

jobs:
  # Resolve the version before anything expensive runs. Three of the four ways a
  # beta dispatch is a mistake -- nothing new on main, no open release PR, a tag
  # that already exists -- are visible from git and the PR list alone, and this
  # job is where they stop. Firefox does not boot until they have all passed.
  #
  # It also pins the commit. The rest of the workflow builds and tests
  # `outputs.built` rather than re-resolving `main`, so a commit landing mid-run
  # cannot leave the scenarios testing one tree and the zips carrying another.
  #
  # ubuntu-latest, not the ARC scale set: this is git and gh, like Force Release.
  version:
    name: Work out the beta version
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.ver.outputs.stable }}
      range: ${{ steps.ver.outputs.range }}
      since: ${{ steps.ver.outputs.since }}
      next: ${{ steps.ver.outputs.next }}
      n: ${{ steps.ver.outputs.n }}
      tag: ${{ steps.ver.outputs.tag }}
      manifest: ${{ steps.ver.outputs.manifest }}
      zip: ${{ steps.ver.outputs.zip }}
      built: ${{ steps.ver.outputs.built }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the beta version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Before the first stable release there is no tag: every commit on main
          # counts, and the manifest alias starts from 0.0.0.
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-beta*' 2>/dev/null || true)
          if [ -n "$LAST" ]; then
            STABLE="${LAST#v}"
            RANGE="${LAST}..HEAD"
          else
            STABLE="0.0.0"
            RANGE="HEAD"
            echo "::notice::No stable tag yet; counting every commit on main."
          fi
          N=$(git rev-list --count "$RANGE")
          if [ "$N" -eq 0 ]; then
            echo "::error::main is exactly ${LAST}; nothing to beta."; exit 1
          fi
          TITLE=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title,headRefName \
                    --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].title // empty')
          NEXT=$(printf '%s' "$TITLE" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$NEXT" ]; then
            echo "::error::No open release PR, so there is nothing releasable on main to beta."; exit 1
          fi
          TAG="v${NEXT}-beta.${N}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists; no new commits since the last beta."; exit 1
          fi
          {
            echo "stable=${STABLE}"
            echo "range=${RANGE}"
            echo "since=${LAST:-the first commit}"
            echo "next=${NEXT}"
            echo "n=${N}"
            echo "tag=${TAG}"
            echo "manifest=${STABLE}.${N}"
            echo "zip=${NEXT}-beta.${N}"
            echo "built=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${TAG} (manifest ${STABLE}.${N}) from $(git rev-parse --short HEAD)"

  # The same scenarios, in the same two Firefoxes, that gate a pull request --
  # pinned to the exact commit this beta ships rather than to `main`, which may
  # have moved since the version job read it. See the header on what this gate
  # does and does not buy.
  e2e:
    name: E2E
    needs: version
    uses: ./.github/workflows/e2e.yaml
    with:
      ref: ${{ needs.version.outputs.built }}
    permissions:
      contents: read
      actions: read

  beta:
    name: Tag, build and publish a beta
    needs: [version, e2e]
    runs-on: timed-tabs   # self-hosted ARC scale set (private-ops arc/runners/values-timed-tabs.yaml)
    steps:
      # The commit the version job pinned, not `main` as it stands now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.built }}
          fetch-depth: 0

      # The action comes from the ref this workflow is running from, which is
      # not what the job builds: the beta builds the pinned commit on `main`,
      # which need not contain the action -- on the run that adds it, it does not. It lands in
      # a path of its own so its sparse checkout cannot follow the build tree
      # around and leave, say, package-lock.json unmaterialised.
      - uses: actions/checkout@v7
        with:
          path: .gh-cli
          sparse-checkout: |
            .github/actions/gh-cli
            .github/actions/node-toolcache
            .github/actions/step-times
          sparse-checkout-cone-mode: false
      # The ARC image has no gh; GitHub-hosted ones do. A no-op on those.
      - uses: ./.gh-cli/.github/actions/gh-cli

      - uses: ./.gh-cli/.github/actions/node-toolcache
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build beta zips
        env:
          BUILD_CHANNEL: beta
          BUILD_SEMVER: ${{ needs.version.outputs.next }}
          BUILD_TAG: beta.${{ needs.version.outputs.n }}
          MANIFEST_VERSION: ${{ needs.version.outputs.manifest }}
          ZIP_VERSION: ${{ needs.version.outputs.zip }}
        run: |
          npm run package
          # Lint what ships, not src/: the built manifest carries the beta
          # name and the four-part version.
          npx web-ext lint --source-dir dist/firefox
          ls -la web-ext-artifacts
          cat dist/firefox/build.json

      - name: Tag and publish the prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SINCE: ${{ needs.version.outputs.since }}
          RANGE: ${{ needs.version.outputs.range }}
          MANIFEST: ${{ needs.version.outputs.manifest }}
          BUILT: ${{ needs.version.outputs.built }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          {
            echo "Beta build of the work on \`main\` since ${SINCE}. Installs as version \`${MANIFEST}\`; the UI shows \`${TAG#v}\` with a BETA badge."
            echo ""
            echo "**Firefox:** load \`timed-tabs-firefox-*.zip\` from about:debugging → This Firefox → Load Temporary Add-on."
            echo "**Chrome (not yet supported):** the Chrome zip is attached so the build can be tried. Unzip \`timed-tabs-chrome-*.zip\`, then chrome://extensions → Developer mode → Load unpacked. It does not load in Firefox."
            echo ""
            echo "## Changes since ${SINCE}"
            echo ""
            git log --no-merges --pretty='- %s (%h)' "${RANGE}"
          } > "$NOTES"
          # `gh release create` makes the tag on the given commit: the one the
          # version job pinned, which is the commit E2E tested and this job
          # built, not GITHUB_SHA, which is the dispatch ref and may be another
          # branch. No PAT needed, nothing downstream has to be re-triggered
          # by the push.
          gh release create "$TAG" web-ext-artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$BUILT" \
            --prerelease --title "$TAG" --notes-file "$NOTES"

      # From the sparse checkout of this ref, not the `main` tree it built.
      - uses: ./.gh-cli/.github/actions/step-times
        if: always()
        with:
          token: ${{ github.token }}

      - name: 📋 Summary
        if: always()
        env:
          TAG: ${{ needs.version.outputs.tag }}
          ZIP: ${{ needs.version.outputs.zip }}
          MANIFEST: ${{ needs.version.outputs.manifest }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then s="✅ published"; else s="❌ failed"; fi
          {
            echo "# 🧪 Beta ${TAG:-?} ${s}"
            echo ""
            echo "> ▶️ **Why this ran:** manual dispatch — a beta snapshot of \`main\`."
            echo ""
            echo "| 🏷️ Tag | 🦊 Firefox | 🌐 Chrome | manifest version |"
            echo "| --- | --- | --- | --- |"
            echo "| \`${TAG}\` | \`timed-tabs-firefox-${ZIP}.zip\` | \`timed-tabs-chrome-${ZIP}.zip\` | \`${MANIFEST}\` |"
            echo ""
            echo "📦 Attached to the [prerelease](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}). Unsigned, like stable."
          } >> "$GITHUB_STEP_SUMMARY"
