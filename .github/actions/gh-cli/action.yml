name: Ensure gh
description: >
  Put the GitHub CLI on PATH. GitHub-hosted images ship it; the self-hosted ARC
  image does not, which is what broke Beta Release when the jobs moved onto the
  scale set. A no-op wherever gh is already there.

inputs:
  version:
    description: Which gh release to fetch when the runner has none.
    required: false
    # Pinned so a run is reproducible. Bump it here; nothing else refers to it.
    default: "2.63.2"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if command -v gh >/dev/null 2>&1; then
          echo "gh is already here: $(gh --version | head -1)"
          exit 0
        fi
        echo "No gh on this runner; fetching ${VERSION}."
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "::error::No gh build for $(uname -m)"; exit 1 ;;
        esac
        dir="${RUNNER_TEMP:-/tmp}/gh"
        mkdir -p "$dir"
        url="https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_${arch}.tar.gz"
        curl -fsSL "$url" | tar -xz -C "$dir" --strip-components=1
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/gh" --version
