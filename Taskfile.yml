# Task runner for Timed Tabs. https://taskfile.dev
#
#   task run                      run Firefox with the extension from this checkout
#   task run WT=visual-language   ...from the worktree at worktrees/visual-language
#   task run:dev DEV=path.json    dev build (seeded settings/rules, "-dev" version tag)
#   task run:dev:pinned DEV=...   the same, in a kept profile with the button on the toolbar
#   task run:dev:chrome DEV=...   the same dev build, in Chrome
#   task check                    lint + test
#   task package                  release zips into web-ext-artifacts/
#
# Any target that takes WT works against a worktree; without WT it uses the
# checkout the Taskfile lives in.

version: "3"

vars:
  # Source tree to load: this checkout, or a named worktree under worktrees/.
  WT: ""
  # The main checkout, found via git's common dir so this works from inside any worktree.
  REPO:
    sh: dirname "$(git -C "{{.TASKFILE_DIR}}" rev-parse --path-format=absolute --git-common-dir)"
  ROOT:
    sh: '[ -n "{{.WT}}" ] && echo "{{.REPO}}/worktrees/{{.WT}}" || echo "{{.TASKFILE_DIR}}"'
  # A page the test browser opens; the extension's own pages need the dev build.
  URL: "about:debugging#/runtime/this-firefox"
  # Firefox prefs that keep a throwaway profile quiet.
  PREFS: >-
    --pref termsofuse.bypassNotification=true
    --pref browser.aboutwelcome.enabled=false
    --pref app.update.enabled=false
  # A profile that is kept between runs, so the toolbar button can stay pinned.
  # Outside the repo, so every worktree shares one and none of them ship it.
  PROFILE:
    sh: echo "${TIMED_TABS_PROFILE:-$HOME/.cache/timed-tabs-profile}"

tasks:
  default:
    cmds:
      - task --list

  run:
    desc: "Launch Firefox (throwaway profile) with the extension loaded from src/. WT=<worktree> to use a worktree."
    dir: "{{.ROOT}}"
    cmds:
      - echo "Loading {{.ROOT}}/src"
      - npx web-ext run --source-dir src --start-url "{{.URL}}" {{.PREFS}}

  run:dev:
    desc: "Build dist/dev (dev id, optional DEV=<dev.json> seed) and launch Firefox with it, logging console output."
    dir: "{{.ROOT}}"
    cmds:
      - DEV_JSON="{{.DEV}}" node scripts/build.mjs dev
      - >-
        npx web-ext run --verbose --source-dir dist/dev --start-url "{{.URL}}" {{.PREFS}}
        --pref devtools.console.stdout.content=true --pref devtools.console.stdout.chrome=true

  run:dev:pinned:
    desc: "run:dev in a kept profile with the toolbar button pinned to the toolbar, where users actually see it. DEV=<dev.json> to seed."
    dir: "{{.ROOT}}"
    cmds:
      - DEV_JSON="{{.DEV}}" node scripts/build.mjs dev
      - node "{{.ROOT}}/scripts/dev-profile.mjs" "{{.PROFILE}}"
      - >-
        npx web-ext run --verbose --source-dir dist/dev --start-url "{{.URL}}"
        --firefox-profile "{{.PROFILE}}" --profile-create-if-missing --keep-profile-changes
        --pref devtools.console.stdout.content=true
        --pref devtools.console.stdout.chrome=true
        {{.PREFS}}

  run:dev:chrome:
    desc: "Build dist/chrome-dev (optional DEV=<dev.json> seed) and launch Chrome with it."
    dir: "{{.ROOT}}"
    cmds:
      - DEV_JSON="{{.DEV}}" node scripts/build.mjs chrome-dev
      # web-ext loads it over the DevTools protocol: --load-extension is ignored
      # by branded Chrome now. See docs/developer/chrome.md.
      - npx web-ext run --target chromium --source-dir dist/chrome-dev

  check:
    desc: "Lint and test. WT=<worktree> to check a worktree."
    dir: "{{.ROOT}}"
    cmds:
      - npm run lint
      - npm test

  package:
    desc: "Build the Firefox and Chrome release zips into web-ext-artifacts/. WT=<worktree> to package a worktree."
    dir: "{{.ROOT}}"
    cmds:
      - npm run package
      - ls -la web-ext-artifacts

  install:
    desc: "Install dependencies (npm ci). WT=<worktree> for a worktree."
    dir: "{{.ROOT}}"
    cmds:
      - npm ci

  worktrees:
    desc: "List git worktrees."
    cmds:
      - git worktree list
